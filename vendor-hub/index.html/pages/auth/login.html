<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VendorHub | Secure Access Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="../../assets/css/auth.css">
    <style>
        .alert-box {
            display: none;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            font-weight: 500;
            text-align: center;
        }

        .alert-error {
            background: rgba(255, 68, 68, 0.15);
            border: 1px solid #ff4444;
            color: #ff6b6b;
        }

        .alert-info {
            background: rgba(0, 210, 255, 0.15);
            border: 1px solid var(--accent-primary);
            color: var(--accent-primary);
        }

        .alert-success {
            background: rgba(82, 196, 26, 0.15);
            border: 1px solid #52c41a;
            color: #73d13d;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <h2>System Login</h2>
        <div id="auth-alert" class="alert-box"></div>

        <form id="login-form">
            <div class="form-group">
                <input type="email" id="login-email" placeholder="ACCESS_ID (EMAIL)" required autocomplete="email">
            </div>
            <div class="form-group">
                <input type="password" id="login-password" placeholder="SECURITY_KEY (PASSWORD)" required autocomplete="current-password">
            </div>
            <button type="submit" id="submit-btn" class="auth-btn">Initialize Connection</button>
        </form>
        <p class="auth-footer">New User? <a href="register.html" style="color:var(--accent-primary)">Register Terminal</a></p>
    </div>

    <script type="module">
        import { loginUser } from "../../assets/js/modules/auth.js";
        import { initParallax } from "../../assets/js/utils/parallax.js";
        import { initTheme } from "../../assets/js/utils/theme-handler.js";

        initTheme();
        initParallax();

        const alertBox = document.getElementById('auth-alert');
        function showAlert(msg, type = 'error') {
            alertBox.textContent = msg;
            alertBox.className = `alert-box alert-${type}`;
            alertBox.style.display = 'block';
        }

        // Check if redirected after seller registration
        const params = new URLSearchParams(window.location.search);
        if (params.get('pending') === 'true') {
            showAlert("Registration submitted! Your seller application is pending admin approval.", 'info');
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerText = "Authenticating...";
            alertBox.style.display = 'none';

            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            const res = await loginUser(email, password);

            if (res.success) {
                showAlert("Access granted. Initializing session...", 'success');
                setTimeout(() => {
                    if (res.role === 'admin') {
                        window.location.href = "../admin/dashboard.html";
                    } else if (res.role === 'seller') {
                        if (res.status === 'pending') {
                            showAlert("ACCESS DENIED: Your seller account is pending admin approval.", 'error');
                            btn.disabled = false;
                            btn.innerText = "Initialize Connection";
                        } else if (res.status === 'rejected') {
                            showAlert("ACCESS DENIED: Account application was rejected by administrator.", 'error');
                            btn.disabled = false;
                            btn.innerText = "Initialize Connection";
                        } else {
                            window.location.href = "../seller/dashboard.html";
                        }
                    } else {
                        window.location.href = "../buyer/shop.html";
                    }
                }, 800);
            } else {
                showAlert("ERROR: " + (res.error || "Authentication failed").toUpperCase(), 'error');
                btn.disabled = false;
                btn.innerText = "Initialize Connection";
            }
        });
    </script>
</body>
</html>
