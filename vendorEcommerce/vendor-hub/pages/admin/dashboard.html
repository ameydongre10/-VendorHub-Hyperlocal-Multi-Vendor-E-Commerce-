<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - VendorHub</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="../../assets/css/dashboard.css">
    <style>
        .order-admin-card {
            background: #fff;
            padding: 1rem;
            margin-bottom: 1rem;
            border-radius: 8px;
            border-left: 5px solid #3498db;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .order-info span { display: block; font-size: 0.85rem; color: #666; }
        .admin-controls select { padding: 5px; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="dashboard-wrapper">
        <aside>
            <h3>Admin Panel</h3>
            <ul>
                <li><a href="dashboard.html" class="active">Overview</a></li>
                <li><a href="vendor-requests.html">Vendor Requests</a></li>
                <li><a href="analytics.html">Detailed Analytics</a></li>
                <li><a href="#" id="logout-btn">Logout</a></li>
            </ul>
        </aside>

        <main>
            <h2>Platform Overview</h2>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <h4>Gross Sales</h4>
                    <p id="total-sales">$0</p>
                </div>
                <div class="stat-card">
                    <h4>Total Orders</h4>
                    <p id="total-orders">0</p>
                </div>
            </div>

            <section style="margin-top: 2rem;">
                <h3>Global Order Management</h3>
                <div id="admin-orders-list">
                    <p>Loading orders...</p>
                </div>
            </section>

            <section style="margin-top: 2rem;">
                <h3>Pending Vendor Approvals</h3>
                <div id="vendor-list"></div>
            </section>
        </main>
    </div>

    <script type="module">
        import { getPlatformAnalytics, getPendingVendors, updateVendorStatus } from "../../assets/js/modules/admin.js";
        // Import order functions
        import { updateOrderStatus } from "../../assets/js/modules/orders.js";
        import { db } from "../../assets/js/config/firebase-config.js";
        import { collection, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        async function initAdmin() {
            // 1. Load Analytics
            const stats = await getPlatformAnalytics();
            document.getElementById('total-sales').innerText = `$${stats.totalSales.toFixed(2)}`;
            document.getElementById('total-orders').innerText = stats.totalOrders;

            // 2. Load Pending Vendors
            const vendors = await getPendingVendors();
            const list = document.getElementById('vendor-list');
            list.innerHTML = vendors.length ? vendors.map(v => `
                <div class="vendor-card">
                    <p><strong>${v.name}</strong> (${v.email})</p>
                    <button class="approve-btn" onclick="approveVendor('${v.id}')">Approve</button>
                    <button class="reject-btn" onclick="rejectVendor('${v.id}')">Reject</button>
                </div>
            `).join('') : "<p>No pending requests.</p>";

            // 3. Load All Orders for Admin
            loadAllOrders();
        }

        async function loadAllOrders() {
            const container = document.getElementById('admin-orders-list');
            try {
                // Fetch every order on the platform
                const q = query(collection(db, "orders"), orderBy("createdAt", "desc"));
                const snapshot = await getDocs(q);
                
                if (snapshot.empty) {
                    container.innerHTML = "<p>No orders found on the platform.</p>";
                    return;
                }

                container.innerHTML = snapshot.docs.map(doc => {
                    const order = doc.data();
                    return `
                        <div class="order-admin-card">
                            <div class="order-info">
                                <strong>Order #${doc.id.slice(-6)}</strong>
                                <span>Buyer ID: ${order.buyerId.slice(-6)}</span>
                                <span>Amount: $${order.totalAmount.toFixed(2)}</span>
                            </div>
                            <div class="admin-controls">
                                <select onchange="adminUpdateStatus('${doc.id}', this.value)">
                                    <option value="Placed" ${order.status === 'Placed' ? 'selected' : ''}>Placed</option>
                                    <option value="Shipped" ${order.status === 'Shipped' ? 'selected' : ''}>Shipped</option>
                                    <option value="Delivered" ${order.status === 'Delivered' ? 'selected' : ''}>Delivered</option>
                                    <option value="Cancelled" ${order.status === 'Cancelled' ? 'selected' : ''}>Cancelled</option>
                                </select>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (err) {
                container.innerHTML = "<p>Error loading orders.</p>";
                console.error(err);
            }
        }

        // Global functions for buttons/dropdowns
        window.approveVendor = async (id) => {
            await updateVendorStatus(id, 'approved');
            initAdmin(); // Refresh UI without full reload
        };

        window.rejectVendor = async (id) => {
            await updateVendorStatus(id, 'rejected');
            initAdmin();
        };

        window.adminUpdateStatus = async (orderId, newStatus) => {
            const res = await updateOrderStatus(orderId, newStatus);
            if (res.success) {
                alert("Order status updated successfully!");
            } else {
                alert("Failed to update order: " + res.error);
            }
        };

        initAdmin();
    </script>
    <button id="theme-toggle" style="margin: 10px; padding: 5px 10px; cursor: pointer; border-radius: 20px; border: 1px solid #ccc;">
    🌓 Switch Theme
</button>

<script type="module">
    import { initTheme, toggleTheme } from "../../assets/js/utils/theme-handler.js";
    
    // Run on load
    initTheme();

    document.getElementById('theme-toggle').addEventListener('click', toggleTheme);
</script>
</body>
</html>
