<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard – VendorHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/design-system.css">
    <link rel="stylesheet" href="../../assets/css/responsive.css">
    <style>
        .vendor-card {
            background: var(--glass-fill);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 12px;
        }
    </style>
</head>
<body>

    <div class="mobile-nav">
        <button class="hamburger" id="hamburger-btn" aria-label="Open menu" aria-expanded="false">
            <span></span><span></span><span></span>
        </button>
        <span style="font-family:var(--font-display);font-size:0.9rem;color:var(--accent-primary);letter-spacing:2px;">VENDORHUB</span>
        <span></span>
    </div>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <div class="dashboard-wrapper">

        <aside class="sidebar" id="sidebar" role="navigation" aria-label="Admin navigation">
            <div class="sidebar-brand">Admin Panel</div>
            <ul class="sidebar-nav" role="list">
                <li><a href="dashboard.html" class="active" aria-current="page">📊 Overview</a></li>
                <li><a href="vendor-requests.html">🏪 Vendor Requests</a></li>
                <li><a href="analytics.html">📈 Analytics</a></li>
                <li><a href="#" id="logout-btn">🚪 Logout</a></li>
            </ul>
        </aside>

        <main class="main-content" role="main">

            <h2 style="margin-bottom:8px;">Platform Overview</h2>
            <p style="margin-bottom:32px;">Monitor all platform activity and manage vendors.</p>

            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-card">
                    <h4>Gross Sales</h4>
                    <div class="stat-value" id="total-sales">—</div>
                </div>
                <div class="stat-card">
                    <h4>Total Orders</h4>
                    <div class="stat-value" id="total-orders">—</div>
                </div>
                <div class="stat-card">
                    <h4>Pending Vendors</h4>
                    <div class="stat-value" id="pending-count">—</div>
                </div>
            </div>

            <!-- Pending Vendor Approvals -->
            <section style="margin-bottom:var(--space-xl);" aria-labelledby="vendors-heading">
                <h3 id="vendors-heading" style="margin-bottom:var(--space-md);">⏳ Pending Vendor Approvals</h3>
                <div id="vendor-list">
                    <div class="empty-state" style="padding:20px 0;">
                        <div class="spinner"></div>
                    </div>
                </div>
            </section>

            <!-- All Orders -->
            <section aria-labelledby="orders-heading">
                <h3 id="orders-heading" style="margin-bottom:var(--space-md);">📋 All Orders</h3>
                <div id="admin-orders-list">
                    <div class="empty-state" style="padding:20px 0;">
                        <div class="spinner"></div>
                    </div>
                </div>
            </section>

        </main>
    </div>

    <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

    <script type="module">
        import { checkAuthState, logoutUser } from "../../assets/js/modules/auth.js";
        import {
            getPlatformStats,
            fetchVendorsByStatus,
            setVendorStatus,
            fetchAllOrders,
            setOrderStatus,
        } from "../../assets/js/modules/api-service.js";
        import { showToast, handleError } from "../../assets/js/modules/error-handler.js";
        import { renderOrderCard } from "../../assets/js/utils/ui-render.js";
        import { formatCurrency } from "../../assets/js/utils/helpers.js";

        // ── Auth Guard ──────────────────────────────────────────────────
        checkAuthState((user) => {
            if (!user || user.role !== 'admin') {
                window.location.href = '../auth/login.html';
                return;
            }
            initAdmin();
        });

        async function initAdmin() {
            // Stats
            const statsRes = await getPlatformStats();
            if (statsRes.success) {
                document.getElementById('total-sales').textContent  = formatCurrency(statsRes.data.totalSales);
                document.getElementById('total-orders').textContent = statsRes.data.totalOrders;
            }

            // Pending Vendors
            await loadPendingVendors();

            // Orders
            await loadAllOrders();
        }

        async function loadPendingVendors() {
            const res = await fetchVendorsByStatus('pending');
            const list = document.getElementById('vendor-list');

            if (!res.success) {
                list.innerHTML = `<p style="color:var(--danger)">Failed to load vendors.</p>`;
                return;
            }

            document.getElementById('pending-count').textContent = res.data.length;

            if (res.data.length === 0) {
                list.innerHTML = `<div class="empty-state" style="padding:16px 0;">
                    <span style="font-size:1.5rem;">✅</span>
                    <p>No pending vendor requests.</p>
                </div>`;
                return;
            }

            list.innerHTML = res.data.map(v => `
                <div class="vendor-card">
                    <div>
                        <strong style="color:#fff">${escHtml(v.name)}</strong>
                        <span style="display:block;font-size:0.8rem;color:var(--text-muted);">${escHtml(v.email)}</span>
                    </div>
                    <div style="display:flex;gap:8px;">
                        <button class="btn btn-primary btn-sm" onclick="approveVendor('${v.id}')">✓ Approve</button>
                        <button class="btn btn-danger btn-sm" onclick="rejectVendor('${v.id}')">✕ Reject</button>
                    </div>
                </div>`).join('');
        }

        async function loadAllOrders() {
            const res = await fetchAllOrders();
            const container = document.getElementById('admin-orders-list');

            if (!res.success) {
                handleError({ message: res.error }, 'admin:orders');
                container.innerHTML = `<p style="color:var(--danger)">Failed to load orders.</p>`;
                return;
            }

            if (res.data.length === 0) {
                container.innerHTML = `<div class="empty-state" style="padding:16px 0;">
                    <div class="empty-icon">📭</div>
                    <p>No orders on the platform yet.</p>
                </div>`;
                return;
            }

            container.innerHTML = res.data
                .slice(0, 20)
                .map(o => renderOrderCard(o, true, 'adminUpdateStatus'))
                .join('');
        }

        window.approveVendor = async (id) => {
            const res = await setVendorStatus(id, 'approved');
            if (res.success) {
                showToast('Vendor approved!', 'success');
                loadPendingVendors();
            } else {
                showToast(res.error || 'Failed to approve vendor.', 'error');
            }
        };

        window.rejectVendor = async (id) => {
            const res = await setVendorStatus(id, 'rejected');
            if (res.success) {
                showToast('Vendor rejected.', 'info');
                loadPendingVendors();
            } else {
                showToast(res.error || 'Failed to reject vendor.', 'error');
            }
        };

        window.adminUpdateStatus = async (orderId, status) => {
            const res = await setOrderStatus(orderId, status);
            if (res.success) {
                showToast(`Order status set to "${status}"`, 'success');
            } else {
                showToast(res.error || 'Failed to update order.', 'error');
            }
        };

        // Logout
        document.getElementById('logout-btn').addEventListener('click', (e) => {
            e.preventDefault();
            logoutUser().then(() => { window.location.href = '../auth/login.html'; });
        });

        // Mobile sidebar
        const sidebar  = document.getElementById('sidebar');
        const overlay  = document.getElementById('sidebar-overlay');
        const hamburger = document.getElementById('hamburger-btn');

        hamburger.addEventListener('click', () => {
            const open = sidebar.classList.toggle('open');
            overlay.classList.toggle('visible', open);
            hamburger.setAttribute('aria-expanded', open);
        });

        overlay.addEventListener('click', () => {
            sidebar.classList.remove('open');
            overlay.classList.remove('visible');
            hamburger.setAttribute('aria-expanded', 'false');
        });

        const escHtml = (str) => {
            const map = { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' };
            return String(str || '').replace(/[&<>"']/g, c => map[c]);
        };
    </script>
</body>
</html>
