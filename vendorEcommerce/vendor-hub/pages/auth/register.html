<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VendorHub | Create Account</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/design-system.css">
    <link rel="stylesheet" href="../../assets/css/responsive.css">
    <style>
        .role-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .role-btn {
            flex: 1;
            padding: 12px;
            border: 1px solid var(--glass-border);
            background: var(--glass-fill);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition-fast);
            border-radius: var(--radius-sm);
            font-family: var(--font-body);
            font-weight: 700;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .role-btn.active,
        .role-btn:hover {
            background: rgba(0, 210, 255, 0.12);
            border-color: var(--accent-primary);
            color: var(--accent-primary);
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.15);
        }
    </style>
</head>
<body>

    <div class="video-bg" aria-hidden="true">
        <video autoplay muted loop playsinline>
            <source src="https://assets.mixkit.co/videos/preview/mixkit-digital-animation-of-blue-and-purple-lines-20707-large.mp4" type="video/mp4">
        </video>
    </div>

    <main class="auth-page" role="main">
        <div class="auth-card animate-in" role="form" aria-labelledby="register-heading">

            <div class="auth-logo">
                <h1>VendorHub</h1>
                <p>Create your free account</p>
            </div>

            <!-- Role Selector -->
            <div class="role-selector" role="group" aria-label="Select account type">
                <button type="button" class="role-btn active" id="role-buyer"
                        onclick="setRole('buyer')" aria-pressed="true">
                    🛒 Buyer
                </button>
                <button type="button" class="role-btn" id="role-seller"
                        onclick="setRole('seller')" aria-pressed="false">
                    🏪 Seller
                </button>
            </div>

            <form id="register-form" novalidate aria-label="Registration form">
                <div class="form-group">
                    <label for="reg-name">Full Name</label>
                    <input
                        type="text"
                        id="reg-name"
                        class="form-control"
                        placeholder="Your full name"
                        autocomplete="name"
                        required
                        aria-required="true"
                    >
                </div>

                <div class="form-group">
                    <label for="reg-email">Email Address</label>
                    <input
                        type="email"
                        id="reg-email"
                        class="form-control"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                        aria-required="true"
                    >
                </div>

                <div class="form-group">
                    <label for="reg-password">Password</label>
                    <input
                        type="password"
                        id="reg-password"
                        class="form-control"
                        placeholder="At least 6 characters"
                        autocomplete="new-password"
                        required
                        aria-required="true"
                    >
                </div>

                <button type="submit" id="register-btn" class="btn btn-primary btn-full mt-md" aria-label="Create account">
                    Create Account
                </button>
            </form>

            <p class="text-center mt-md" style="font-size:0.9rem;color:var(--text-secondary);">
                Already have an account?
                <a href="login.html" style="font-weight:700;">Sign in</a>
            </p>

        </div>
    </main>

    <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

    <script type="module">
        import { registerUser } from "../../assets/js/modules/auth.js";
        import {
            showToast,
            setButtonLoading,
            resetButton,
            validateForm,
        } from "../../assets/js/modules/error-handler.js";

        let selectedRole = 'buyer';

        window.setRole = (role) => {
            selectedRole = role;
            ['buyer', 'seller'].forEach(r => {
                const btn = document.getElementById(`role-${r}`);
                btn.classList.toggle('active', r === role);
                btn.setAttribute('aria-pressed', r === role ? 'true' : 'false');
            });
        };

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const isValid = validateForm([
                { id: 'reg-name',     label: 'Full Name', required: true, minLength: 2 },
                { id: 'reg-email',    label: 'Email',     required: true, type: 'email' },
                { id: 'reg-password', label: 'Password',  required: true, minLength: 6 },
            ]);

            if (!isValid) return;

            const btn = document.getElementById('register-btn');
            setButtonLoading(btn, 'Creating account…');

            const res = await registerUser(
                document.getElementById('reg-email').value.trim(),
                document.getElementById('reg-password').value,
                {
                    name: document.getElementById('reg-name').value.trim(),
                    role: selectedRole,
                }
            );

            if (res.success) {
                showToast('Account created successfully!', 'success', 2000);
                setTimeout(() => {
                    window.location.href = selectedRole === 'seller'
                        ? '../seller/dashboard.html'
                        : '../buyer/shop.html';
                }, 1000);
            } else {
                showToast(res.error || 'Registration failed. Please try again.', 'error');
                resetButton(btn);
            }
        });
    </script>
</body>
</html>
