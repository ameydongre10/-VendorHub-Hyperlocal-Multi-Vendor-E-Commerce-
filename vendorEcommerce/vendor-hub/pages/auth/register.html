<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join VendorHub | Next-Gen Marketplace</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="../../assets/css/auth.css">
    <style>
        .role-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .role-btn {
            flex: 1;
            padding: 12px;
            border: 1px solid var(--accent-primary);
            background: rgba(0, 210, 255, 0.05);
            color: var(--accent-primary);
            cursor: pointer;
            transition: all 0.3s;
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .role-btn.active {
            background: linear-gradient(135deg, var(--accent-secondary), var(--accent-primary));
            color: #000;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.5);
            border-color: #00f2fe;
        }

        .alert-box {
            display: none;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            font-weight: 500;
            text-align: center;
        }

        .alert-error {
            background: rgba(255, 68, 68, 0.15);
            border: 1px solid #ff4444;
            color: #ff6b6b;
        }

        .alert-success {
            background: rgba(82, 196, 26, 0.15);
            border: 1px solid #52c41a;
            color: #73d13d;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <h2>Initiate Account</h2>
        <div id="auth-alert" class="alert-box"></div>

        <div class="role-selector">
            <button type="button" class="role-btn active" id="btn-role-buyer">Buyer</button>
            <button type="button" class="role-btn" id="btn-role-seller">Seller</button>
        </div>

        <form id="register-form">
            <div class="form-group">
                <input type="text" id="reg-name" placeholder="Full Name" required autocomplete="name">
            </div>
            <div class="form-group">
                <input type="email" id="reg-email" placeholder="Email Address" required autocomplete="email">
            </div>
            <div class="form-group">
                <input type="password" id="reg-password" placeholder="Create Password" minlength="6" required autocomplete="new-password">
            </div>
            <button type="submit" id="submit-btn" class="auth-btn">Authorize Registration</button>
        </form>
        <p class="auth-footer">Already a member? <a href="login.html" style="color:var(--accent-primary)">Access Portal</a></p>
    </div>

    <script type="module">
        import { registerUser } from "../../assets/js/modules/auth.js";
        import { initParallax } from "../../assets/js/utils/parallax.js";
        import { initTheme } from "../../assets/js/utils/theme-handler.js";

        initTheme();
        initParallax();

        let selectedRole = 'buyer';

        const buyerBtn = document.getElementById('btn-role-buyer');
        const sellerBtn = document.getElementById('btn-role-seller');
        const alertBox = document.getElementById('auth-alert');

        buyerBtn.addEventListener('click', () => {
            selectedRole = 'buyer';
            buyerBtn.classList.add('active');
            sellerBtn.classList.remove('active');
        });

        sellerBtn.addEventListener('click', () => {
            selectedRole = 'seller';
            sellerBtn.classList.add('active');
            buyerBtn.classList.remove('active');
        });

        function showAlert(message, isSuccess = false) {
            alertBox.textContent = message;
            alertBox.className = `alert-box ${isSuccess ? 'alert-success' : 'alert-error'}`;
            alertBox.style.display = 'block';
        }

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerText = "Processing...";
            alertBox.style.display = 'none';

            const name = document.getElementById('reg-name').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value;

            const res = await registerUser(email, password, {
                name: name,
                role: selectedRole
            });

            if (res.success) {
                if (selectedRole === 'seller') {
                    showAlert("Seller registration submitted! Your account is pending admin approval. Redirecting to login...", true);
                    setTimeout(() => {
                        window.location.href = "login.html?pending=true";
                    }, 2500);
                } else {
                    showAlert("Account created successfully! Redirecting to shop...", true);
                    setTimeout(() => {
                        window.location.href = "../buyer/shop.html";
                    }, 1200);
                }
            } else {
                showAlert(res.error || "Registration failed. Please try again.");
                btn.disabled = false;
                btn.innerText = "Authorize Registration";
            }
        });
    </script>
</body>
</html>
