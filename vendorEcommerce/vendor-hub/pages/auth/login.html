<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VendorHub | Secure Access Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="../../assets/css/auth.css">
    <script src="../../assets/js/config/__env.js"></script>
    <style>
        .alert-box {
            display: none;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            font-weight: 500;
            text-align: center;
        }

        .alert-error {
            background: rgba(255, 68, 68, 0.15);
            border: 1px solid #ff4444;
            color: #ff6b6b;
        }

        .alert-info {
            background: rgba(0, 210, 255, 0.15);
            border: 1px solid var(--accent-primary);
            color: var(--accent-primary);
        }

        .alert-success {
            background: rgba(82, 196, 26, 0.15);
            border: 1px solid #52c41a;
            color: #73d13d;
        }

        .demo-chip-btn {
            background: rgba(0, 210, 255, 0.08);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .demo-chip-btn:hover {
            border-color: var(--accent-primary);
            background: rgba(0, 210, 255, 0.2);
            color: #fff;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <h2>System Login</h2>
        <div id="auth-alert" class="alert-box"></div>

        <form id="login-form">
            <div class="form-group">
                <input type="email" id="login-email" placeholder="ACCESS_ID (EMAIL)" required autocomplete="email">
            </div>
            <div class="form-group">
                <input type="password" id="login-password" placeholder="SECURITY_KEY (PASSWORD)" required autocomplete="current-password">
            </div>
            <button type="submit" id="submit-btn" class="auth-btn">Initialize Connection</button>
        </form>

        <div style="margin-top: 1.5rem; border-top: 1px solid var(--glass-border); padding-top: 1.2rem;">
            <div style="font-size: 0.72rem; text-transform: uppercase; color: var(--text-muted); font-family: 'Orbitron', sans-serif; margin-bottom: 8px; text-align: center; letter-spacing: 1px;">
                ⚡ 1-Click Demo Credentials
            </div>
            <div style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;">
                <button type="button" class="demo-chip-btn" data-email="admin@vendorhub.com" data-pass="admin123">🛡️ Admin</button>
                <button type="button" class="demo-chip-btn" data-email="seller@vendorhub.com" data-pass="seller123">🏪 Seller</button>
                <button type="button" class="demo-chip-btn" data-email="buyer@vendorhub.com" data-pass="buyer123">🛍️ Buyer</button>
            </div>
        </div>

        <p class="auth-footer" style="margin-top: 1.2rem;">New User? <a href="register.html" style="color:var(--accent-primary)">Register Terminal</a></p>
    </div>

    <script type="module">
        import { loginUser } from "../../assets/js/modules/auth.js";
        import { initParallax } from "../../assets/js/utils/parallax.js";
        import { initTheme } from "../../assets/js/utils/theme-handler.js";

        initTheme();
        initParallax();

        const alertBox = document.getElementById('auth-alert');
        function showAlert(msg, type = 'error') {
            alertBox.textContent = msg;
            alertBox.className = `alert-box alert-${type}`;
            alertBox.style.display = 'block';
        }

        // Demo quick-fill listeners
        document.querySelectorAll('.demo-chip-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.getElementById('login-email').value = btn.dataset.email;
                document.getElementById('login-password').value = btn.dataset.pass;
                showAlert(`Selected ${btn.textContent.trim()} credentials. Click Initialize Connection or press Enter.`, 'info');
            });
        });

        // Check if redirected after registration
        const params = new URLSearchParams(window.location.search);
        if (params.get('registered') === 'true') {
            showAlert("Account registered successfully! Enter your password to log in.", 'success');
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerText = "Authenticating...";
            alertBox.style.display = 'none';

            const email = (document.getElementById('login-email').value || '').trim();
            const password = (document.getElementById('login-password').value || '').trim();

            const res = await loginUser(email, password);

            if (res.success) {
                showAlert(`Access granted. Welcome, ${res.name || 'User'}! Redirecting...`, 'success');
                setTimeout(() => {
                    if (res.role === 'admin') {
                        window.location.href = "../admin/dashboard.html";
                    } else if (res.role === 'seller') {
                        window.location.href = "../seller/dashboard.html";
                    } else {
                        window.location.href = "../buyer/shop.html";
                    }
                }, 700);
            } else {
                showAlert(res.error || "Authentication failed. Check your access credentials.", 'error');
                btn.disabled = false;
                btn.innerText = "Initialize Connection";
            }
        });
    </script>
</body>
</html>
