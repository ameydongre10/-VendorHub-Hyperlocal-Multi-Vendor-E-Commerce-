<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VendorHub | Sign In</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/design-system.css">
    <link rel="stylesheet" href="../../assets/css/responsive.css">
</head>
<body>

    <!-- Animated background -->
    <div class="video-bg" aria-hidden="true">
        <video autoplay muted loop playsinline>
            <source src="https://assets.mixkit.co/videos/preview/mixkit-digital-circuit-board-interface-with-moving-data-20708-large.mp4" type="video/mp4">
        </video>
    </div>

    <main class="auth-page" role="main">
        <div class="auth-card animate-in" role="form" aria-labelledby="login-heading">

            <div class="auth-logo">
                <h1>VendorHub</h1>
                <p>Sign in to your account</p>
            </div>

            <form id="login-form" novalidate aria-label="Login form">
                <div class="form-group">
                    <label for="login-email">Email Address</label>
                    <input
                        type="email"
                        id="login-email"
                        class="form-control"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                        aria-required="true"
                    >
                </div>

                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input
                        type="password"
                        id="login-password"
                        class="form-control"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                        aria-required="true"
                    >
                </div>

                <button type="submit" id="login-btn" class="btn btn-primary btn-full mt-md" aria-label="Sign in">
                    Sign In
                </button>
            </form>

            <p class="text-center mt-md" style="font-size:0.9rem;color:var(--text-secondary);">
                New to VendorHub?
                <a href="register.html" style="font-weight:700;">Create an account</a>
            </p>

        </div>
    </main>

    <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

    <script type="module">
        import { loginUser } from "../../assets/js/modules/auth.js";
        import {
            showToast,
            setButtonLoading,
            resetButton,
            validateForm,
        } from "../../assets/js/modules/error-handler.js";

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const isValid = validateForm([
                { id: 'login-email',    label: 'Email',    required: true, type: 'email' },
                { id: 'login-password', label: 'Password', required: true, minLength: 6 },
            ]);

            if (!isValid) return;

            const btn   = document.getElementById('login-btn');
            const email = document.getElementById('login-email').value.trim();
            const pass  = document.getElementById('login-password').value;

            setButtonLoading(btn, 'Signing in…');

            try {
                const res = await loginUser(email, pass);

                if (res.success) {
                    showToast('Welcome back!', 'success', 1500);
                    setTimeout(() => {
                        if (res.role === 'admin') {
                            window.location.href = '../admin/dashboard.html';
                        } else if (res.role === 'seller') {
                            if (res.status === 'pending') {
                                showToast('Your seller account is pending admin approval.', 'warning', 5000);
                                resetButton(btn);
                            } else if (res.status === 'rejected') {
                                showToast('Your seller account has been rejected. Contact support.', 'error', 5000);
                                resetButton(btn);
                            } else {
                                window.location.href = '../seller/dashboard.html';
                            }
                        } else {
                            window.location.href = '../buyer/shop.html';
                        }
                    }, 800);
                } else {
                    showToast(res.error || 'Invalid credentials. Please try again.', 'error');
                    resetButton(btn);
                }
            } catch (err) {
                showToast('An unexpected error occurred. Please try again.', 'error');
                resetButton(btn);
            }
        });
    </script>
</body>
</html>
