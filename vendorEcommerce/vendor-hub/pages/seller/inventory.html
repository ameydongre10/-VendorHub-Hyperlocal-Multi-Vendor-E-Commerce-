<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory – VendorHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/design-system.css">
    <link rel="stylesheet" href="../../assets/css/responsive.css">
</head>
<body>

    <div class="mobile-nav">
        <button class="hamburger" id="hamburger-btn" aria-label="Open menu" aria-expanded="false">
            <span></span><span></span><span></span>
        </button>
        <span style="font-family:var(--font-display);font-size:0.9rem;color:var(--accent-primary);letter-spacing:2px;">VENDORHUB</span>
        <span></span>
    </div>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <div class="dashboard-wrapper">

        <aside class="sidebar" id="sidebar" role="navigation" aria-label="Seller navigation">
            <div class="sidebar-brand">VendorHub</div>
            <ul class="sidebar-nav" role="list">
                <li><a href="dashboard.html">📊 Overview</a></li>
                <li><a href="inventory.html" class="active" aria-current="page">📦 My Products</a></li>
                <li><a href="add-product.html">➕ Add Product</a></li>
                <li><a href="#" id="logout-btn">🚪 Logout</a></li>
            </ul>
        </aside>

        <main class="main-content" role="main">

            <div class="flex-between mb-lg" style="flex-wrap:wrap;gap:12px;">
                <div>
                    <h2 style="margin-bottom:4px;">My Inventory</h2>
                    <p style="font-size:0.85rem;">Manage your listed products and stock levels.</p>
                </div>
                <a href="add-product.html" class="btn btn-primary btn-sm" aria-label="Add new product">
                    ➕ Add Product
                </a>
            </div>

            <div class="inventory-container" role="table" aria-label="Product inventory">
                <div class="inventory-header" role="row" aria-hidden="true">
                    <span role="columnheader">Product</span>
                    <span role="columnheader">Price</span>
                    <span role="columnheader">Stock</span>
                    <span role="columnheader">Actions</span>
                </div>
                <div id="inventory-table-body" role="rowgroup">
                    <div class="empty-state" style="padding:48px 24px;">
                        <div class="spinner" style="width:36px;height:36px;border-width:3px;"></div>
                        <p>Loading inventory…</p>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

    <script type="module">
        import { fetchVendorProducts, removeProduct } from "../../assets/js/modules/api-service.js";
        import { checkAuthState, logoutUser } from "../../assets/js/modules/auth.js";
        import { showToast, handleError } from "../../assets/js/modules/error-handler.js";
        import { renderInventoryRow } from "../../assets/js/utils/ui-render.js";

        checkAuthState((user) => {
            if (user && user.role === 'seller') {
                loadInventory(user.uid);
            } else {
                window.location.href = '../auth/login.html';
            }
        });

        async function loadInventory(uid) {
            const res = await fetchVendorProducts(uid);
            const container = document.getElementById('inventory-table-body');

            if (!res.success) {
                handleError({ message: res.error }, 'inventory');
                container.innerHTML = `<div class="empty-state" style="padding:40px;">
                    <div class="empty-icon">⚠️</div>
                    <p>Failed to load inventory. Please refresh.</p>
                </div>`;
                return;
            }

            if (res.data.length === 0) {
                container.innerHTML = `<div class="empty-state" style="padding:40px;">
                    <div class="empty-icon">📦</div>
                    <p>No products listed yet.</p>
                    <a href="add-product.html" class="btn btn-outline btn-sm mt-md">Add Your First Product</a>
                </div>`;
                return;
            }

            container.innerHTML = res.data.map(p => renderInventoryRow(p)).join('');
        }

        window.handleDelete = async (id) => {
            if (!confirm('Remove this product? This cannot be undone.')) return;

            const res = await removeProduct(id);
            if (res.success) {
                showToast('Product removed.', 'success');
                setTimeout(() => location.reload(), 800);
            } else {
                showToast(res.error || 'Failed to remove product.', 'error');
            }
        };

        document.getElementById('logout-btn').addEventListener('click', (e) => {
            e.preventDefault();
            logoutUser().then(() => { window.location.href = '../auth/login.html'; });
        });

        // Mobile sidebar
        const sidebar  = document.getElementById('sidebar');
        const overlay  = document.getElementById('sidebar-overlay');
        const hamburger = document.getElementById('hamburger-btn');

        hamburger.addEventListener('click', () => {
            const open = sidebar.classList.toggle('open');
            overlay.classList.toggle('visible', open);
            hamburger.setAttribute('aria-expanded', open);
        });

        overlay.addEventListener('click', () => {
            sidebar.classList.remove('open');
            overlay.classList.remove('visible');
            hamburger.setAttribute('aria-expanded', 'false');
        });
    </script>
</body>
</html>
