<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory – VendorHub</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;background:#0a0b10;color:#fff;min-height:100vh;display:flex}
    a{color:inherit;text-decoration:none}
    .sidebar{width:240px;flex-shrink:0;min-height:100vh;background:rgba(0,0,0,0.5);border-right:1px solid rgba(255,255,255,0.05);display:flex;flex-direction:column;padding:0;position:sticky;top:0;height:100vh;backdrop-filter:blur(20px)}
    .sidebar-brand{padding:1.25rem 1.25rem 1rem;border-bottom:1px solid rgba(255,255,255,0.06)}
    .sidebar-logo{font-family:'Orbitron',sans-serif;font-size:1rem;font-weight:800;background:linear-gradient(135deg,#00d2ff,#3a7bd5);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .sidebar-nav-items{flex:1;padding:1rem .75rem;display:flex;flex-direction:column;gap:.25rem}
    .sidebar-link{display:flex;align-items:center;gap:.75rem;padding:.65rem .9rem;border-radius:10px;color:#a0aec0;font-size:.875rem;font-weight:500;transition:all .2s}
    .sidebar-link:hover{background:rgba(255,255,255,0.05);color:#fff}
    .sidebar-link.active{background:rgba(0,210,255,0.1);color:#00d2ff;border-left:2px solid #00d2ff}
    .sidebar-logout{margin:.75rem;padding:.65rem .9rem;border-radius:10px;background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.15);color:#ef4444;font-size:.875rem;font-weight:500;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:.75rem}
    .main{flex:1;overflow-x:hidden;min-width:0}
    .topbar{display:flex;align-items:center;justify-content:space-between;padding:1.25rem 2rem;border-bottom:1px solid rgba(255,255,255,0.06)}
    .topbar-title{font-size:1.05rem;font-weight:600}
    .content{padding:2rem}
    .page-title{font-size:1.6rem;font-weight:700;margin-bottom:.3rem}
    .page-sub{color:#a0aec0;font-size:.875rem;margin-bottom:1.5rem}
    .card{background:rgba(17,19,24,0.8);border:1px solid rgba(255,255,255,0.07);border-radius:16px;padding:1.5rem;backdrop-filter:blur(10px)}
    .toolbar{display:flex;align-items:center;gap:1rem;margin-bottom:1.25rem;flex-wrap:wrap}
    .search-input{flex:1;min-width:200px;padding:.6rem 1rem;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#fff;font-size:.875rem;outline:none;transition:border-color .2s}
    .search-input:focus{border-color:#00d2ff}
    .search-input::placeholder{color:#4a5568}
    .btn-add{padding:.6rem 1.25rem;border-radius:10px;background:linear-gradient(135deg,#00d2ff,#3a7bd5);color:#fff;border:none;font-size:.875rem;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:.4rem}
    .table-wrap{overflow-x:auto}
    table{width:100%;border-collapse:collapse;font-size:.875rem}
    th{padding:.65rem 1rem;text-align:left;font-size:.7rem;font-weight:600;color:#4a5568;text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid rgba(255,255,255,0.06)}
    td{padding:.75rem 1rem;border-bottom:1px solid rgba(255,255,255,0.04);color:#a0aec0;vertical-align:middle}
    tr:last-child td{border-bottom:none}
    tr:hover td{background:rgba(255,255,255,0.02)}
    .product-thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;background:rgba(255,255,255,0.05)}
    .badge{display:inline-block;padding:.2rem .65rem;border-radius:20px;font-size:.72rem;font-weight:600}
    .stock-input{width:70px;padding:.3rem .5rem;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);border-radius:6px;color:#fff;font-size:.85rem;text-align:center;outline:none}
    .stock-input:focus{border-color:#00d2ff}
    .btn-icon{padding:.3rem .6rem;border-radius:6px;font-size:.82rem;cursor:pointer;border:1px solid;background:transparent;transition:all .2s}
    .btn-edit{color:#00d2ff;border-color:rgba(0,210,255,.25)}
    .btn-edit:hover{background:rgba(0,210,255,.1)}
    .btn-del{color:#ef4444;border-color:rgba(239,68,68,.25)}
    .btn-del:hover{background:rgba(239,68,68,.1)}
    @media(max-width:768px){.sidebar{display:none}.content{padding:1rem}}
</style>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-brand"><span class="sidebar-logo">VendorHub</span></div>
    <nav class="sidebar-nav-items">
      <a href="dashboard.html" class="sidebar-link"><span>📊</span> Dashboard</a>
      <a href="inventory.html" class="sidebar-link active"><span>📦</span> Inventory</a>
      <a href="add-product.html" class="sidebar-link"><span>➕</span> Add Product</a>
      <a href="../buyer/shop.html" class="sidebar-link"><span>🛍</span> View Store</a>
    </nav>
    <button class="sidebar-logout" onclick="doLogout()">🚪 Logout</button>
  </aside>
  <div class="main">
    <div class="topbar">
      <span class="topbar-title">Inventory</span>
      <a href="add-product.html" class="btn-add">➕ Add Product</a>
    </div>
    <div class="content">
      <h1 class="page-title">Inventory</h1>
      <p class="page-sub">Manage your product listings and stock levels.</p>
      <div class="card">
        <div class="toolbar">
          <input type="text" id="searchInput" class="search-input" placeholder="Search products...">
          <span id="countLabel" style="font-size:.8rem;color:#4a5568;white-space:nowrap"></span>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody id="tableBody"><tr><td colspan="6" style="text-align:center;color:#4a5568;padding:2rem">Loading...</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { requireAuth, logout } from '../../assets/js/modules/auth-manager.js';
    import { ProductsAPI } from '../../assets/js/modules/api-service.js';
    import { showSuccess, showToast, handleError } from '../../assets/js/modules/error-handler.js';

    window.doLogout = () => logout();
    const session = requireAuth(['seller']);
    if (!session) throw new Error('auth');

    let products = [];
    function fmt(n){return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n||0);}
    function stockStatus(s){ if(s<=0) return ['Out of Stock','#ef4444']; if(s<5) return ['Low Stock','#f59e0b']; return ['Good','#10b981']; }

    function render(list) {
      document.getElementById('countLabel').textContent = list.length+' products';
      const tbody = document.getElementById('tableBody');
      if (!list.length) { tbody.innerHTML='<tr><td colspan="6" style="text-align:center;color:#4a5568;padding:2rem">No products found.</td></tr>'; return; }
      tbody.innerHTML = list.map(p => {
        const [label,color] = stockStatus(p.stock||0);
        const img = p.image || `https://placehold.co/44x44/111318/00d2ff?text=${(p.name||'P').charAt(0)}`;
        return `<tr data-id="${p.id}">
          <td><div style="display:flex;align-items:center;gap:.75rem"><img class="product-thumb" src="${img}" alt="" onerror="this.src='https://placehold.co/44x44/111318/00d2ff?text=P'"><span style="color:#fff;font-weight:500">${p.name}</span></div></td>
          <td>${p.category||'—'}</td>
          <td style="color:#00d2ff;font-weight:600">${fmt(p.price)}</td>
          <td><input class="stock-input" type="number" value="${p.stock||0}" min="0" onchange="updateStock('${p.id}',this.value)"></td>
          <td><span class="badge" style="background:${color}18;color:${color};border:1px solid ${color}30">${label}</span></td>
          <td><div style="display:flex;gap:.4rem">
            <a href="add-product.html?edit=${p.id}" class="btn-icon btn-edit">✏️</a>
            <button class="btn-icon btn-del" onclick="deleteProduct('${p.id}','${p.name}')">🗑</button>
          </div></td>
        </tr>`;
      }).join('');
    }

    window.updateStock = async function(id, val) {
      try { await ProductsAPI.update(id, {stock:parseInt(val)||0}); showSuccess('Stock updated.'); const p = products.find(x=>x.id===id); if(p) p.stock=parseInt(val)||0; }
      catch(e){ handleError(e,'update-stock'); }
    };

    window.deleteProduct = async function(id, name) {
      if (!confirm('Delete "'+name+'"? This cannot be undone.')) return;
      try {
        await ProductsAPI.delete(id);
        products = products.filter(p=>p.id!==id);
        render(filtered());
        showSuccess('Product deleted.');
      } catch(e){ handleError(e,'delete'); }
    };

    function filtered(){ const q=document.getElementById('searchInput').value.toLowerCase(); return q?products.filter(p=>(p.name+p.category||'').toLowerCase().includes(q)):products; }
    document.getElementById('searchInput').addEventListener('input',()=>render(filtered()));

    (async()=>{ try { products = await ProductsAPI.getByVendor(session.uid); render(products); } catch(e){ document.getElementById('tableBody').innerHTML='<tr><td colspan="6" style="text-align:center;color:#ef4444;padding:2rem">Failed to load products.</td></tr>'; } })();
  </script>
</body>
</html>
