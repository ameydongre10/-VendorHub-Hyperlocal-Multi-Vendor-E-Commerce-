<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Dashboard – VendorHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/design-system.css">
    <link rel="stylesheet" href="../../assets/css/responsive.css">
</head>
<body>

    <!-- Mobile top bar -->
    <div class="mobile-nav">
        <button class="hamburger" id="hamburger-btn" aria-label="Open menu" aria-expanded="false">
            <span></span><span></span><span></span>
        </button>
        <span style="font-family:var(--font-display);font-size:0.9rem;color:var(--accent-primary);letter-spacing:2px;">VENDORHUB</span>
        <span></span>
    </div>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <div class="dashboard-wrapper">

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar" role="navigation" aria-label="Seller navigation">
            <div class="sidebar-brand">VendorHub</div>
            <ul class="sidebar-nav" role="list">
                <li><a href="dashboard.html" class="active" aria-current="page">📊 Overview</a></li>
                <li><a href="inventory.html">📦 My Products</a></li>
                <li><a href="add-product.html">➕ Add Product</a></li>
                <li><a href="#" id="logout-btn">🚪 Logout</a></li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="main-content" role="main">

            <div class="flex-between mb-lg" style="flex-wrap:wrap;gap:12px;">
                <div>
                    <h2 style="margin-bottom:4px;">Seller Dashboard</h2>
                    <p style="font-size:0.85rem;">Welcome back! Here's your platform overview.</p>
                </div>
            </div>

            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-card">
                    <h4>Net Earnings</h4>
                    <div class="stat-value" id="stat-earnings">—</div>
                </div>
                <div class="stat-card">
                    <h4>Total Orders</h4>
                    <div class="stat-value" id="stat-orders">—</div>
                </div>
                <div class="stat-card">
                    <h4>Commission (10%)</h4>
                    <div class="stat-value" id="stat-commission">—</div>
                </div>
            </div>

            <!-- Low Stock Alerts -->
            <section style="margin-bottom:var(--space-xl);" aria-labelledby="stock-heading">
                <h3 id="stock-heading" style="margin-bottom:var(--space-md);">⚠️ Low Stock Alerts</h3>
                <div id="stock-alerts-list">
                    <div class="empty-state" style="padding:20px 0;">
                        <div class="spinner"></div>
                        <p>Checking stock…</p>
                    </div>
                </div>
            </section>

            <!-- Recent Orders -->
            <section aria-labelledby="orders-heading">
                <h3 id="orders-heading" style="margin-bottom:var(--space-md);">📋 Recent Orders</h3>
                <div id="vendor-orders-container">
                    <div class="empty-state" style="padding:20px 0;">
                        <div class="spinner"></div>
                        <p>Loading orders…</p>
                    </div>
                </div>
            </section>

        </main>
    </div>

    <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

    <script type="module">
        import { checkAuthState, logoutUser } from "../../assets/js/modules/auth.js";
        import { getVendorStats, getLowStockItems, fetchVendorOrders, setOrderStatus } from "../../assets/js/modules/api-service.js";
        import { showToast, handleError } from "../../assets/js/modules/error-handler.js";
        import { renderOrderCard } from "../../assets/js/utils/ui-render.js";
        import { formatCurrency } from "../../assets/js/utils/helpers.js";

        // ── Auth Guard ──────────────────────────────────────────────────
        checkAuthState(async (user) => {
            if (!user || user.role !== 'seller') {
                window.location.href = '../auth/login.html';
                return;
            }
            if (user.status !== 'approved') {
                showToast('Your seller account is pending admin approval.', 'warning', 6000);
                setTimeout(() => { window.location.href = '../auth/login.html'; }, 3000);
                return;
            }
            await initDashboard(user.uid);
        });

        async function initDashboard(uid) {
            // Stats
            const statsRes = await getVendorStats(uid);
            if (statsRes.success) {
                const s = statsRes.data;
                document.getElementById('stat-earnings').textContent    = formatCurrency(s.netEarnings);
                document.getElementById('stat-orders').textContent      = s.orderCount;
                document.getElementById('stat-commission').textContent  = formatCurrency(s.commissionDeducted);
            } else {
                handleError({ message: statsRes.error }, 'dashboard:stats');
            }

            // Low Stock
            const stockRes = await getLowStockItems(uid);
            const stockEl = document.getElementById('stock-alerts-list');
            if (stockRes.success && stockRes.data.length > 0) {
                stockEl.innerHTML = stockRes.data.map(p => `
                    <div class="order-card" style="border-left:3px solid var(--danger);">
                        <span style="color:#fff;font-weight:600;">${escHtml(p.name)}</span>
                        <span class="badge badge-danger">${p.stock} left</span>
                    </div>`).join('');
            } else {
                stockEl.innerHTML = `<div class="empty-state" style="padding:16px 0;">
                    <span style="font-size:1.5rem;">✅</span>
                    <p>All products are well stocked!</p>
                </div>`;
            }

            // Orders
            const ordersRes = await fetchVendorOrders(uid);
            const ordersEl = document.getElementById('vendor-orders-container');
            if (ordersRes.success && ordersRes.data.length > 0) {
                ordersEl.innerHTML = ordersRes.data
                    .slice(0, 10)
                    .map(o => renderOrderCard(o, true, 'changeStatus'))
                    .join('');
            } else {
                ordersEl.innerHTML = `<div class="empty-state" style="padding:16px 0;">
                    <div class="empty-icon">📭</div>
                    <p>No orders yet. Share your products!</p>
                </div>`;
            }
        }

        window.changeStatus = async (orderId, status) => {
            const res = await setOrderStatus(orderId, status);
            if (res.success) {
                showToast(`Order status updated to "${status}"`, 'success');
            } else {
                showToast(res.error || 'Failed to update order status.', 'error');
            }
        };

        // ── Logout ──────────────────────────────────────────────────────
        document.getElementById('logout-btn').addEventListener('click', (e) => {
            e.preventDefault();
            logoutUser().then(() => { window.location.href = '../auth/login.html'; });
        });

        // ── Mobile Sidebar Toggle ───────────────────────────────────────
        const sidebar  = document.getElementById('sidebar');
        const overlay  = document.getElementById('sidebar-overlay');
        const hamburger = document.getElementById('hamburger-btn');

        hamburger.addEventListener('click', () => {
            const open = sidebar.classList.toggle('open');
            overlay.classList.toggle('visible', open);
            hamburger.setAttribute('aria-expanded', open);
        });

        overlay.addEventListener('click', () => {
            sidebar.classList.remove('open');
            overlay.classList.remove('visible');
            hamburger.setAttribute('aria-expanded', 'false');
        });

        const escHtml = (str) => {
            const map = { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' };
            return String(str || '').replace(/[&<>"']/g, c => map[c]);
        };
    </script>
</body>
</html>
