<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seller Dashboard – VendorHub</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;background:#0a0b10;color:#fff;min-height:100vh;display:flex}
    a{color:inherit;text-decoration:none}
    .sidebar{width:240px;flex-shrink:0;min-height:100vh;background:rgba(0,0,0,0.5);border-right:1px solid rgba(255,255,255,0.05);display:flex;flex-direction:column;padding:0;position:sticky;top:0;height:100vh;backdrop-filter:blur(20px)}
    .sidebar-brand{padding:1.25rem 1.25rem 1rem;border-bottom:1px solid rgba(255,255,255,0.06)}
    .sidebar-logo{font-family:'Orbitron',sans-serif;font-size:1rem;font-weight:800;background:linear-gradient(135deg,#00d2ff,#3a7bd5);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .sidebar-nav-items{flex:1;padding:1rem .75rem;display:flex;flex-direction:column;gap:.25rem}
    .sidebar-link{display:flex;align-items:center;gap:.75rem;padding:.65rem .9rem;border-radius:10px;color:#a0aec0;font-size:.875rem;font-weight:500;transition:all .2s}
    .sidebar-link:hover{background:rgba(255,255,255,0.05);color:#fff}
    .sidebar-link.active{background:rgba(0,210,255,0.1);color:#00d2ff;border-left:2px solid #00d2ff}
    .sidebar-logout{margin:.75rem;padding:.65rem .9rem;border-radius:10px;background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.15);color:#ef4444;font-size:.875rem;font-weight:500;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:.75rem}
    .sidebar-logout:hover{background:rgba(239,68,68,0.15)}
    .main{flex:1;overflow-x:hidden;min-width:0}
    .topbar{display:flex;align-items:center;justify-content:space-between;padding:1.25rem 2rem;border-bottom:1px solid rgba(255,255,255,0.06);background:rgba(10,11,16,0.7)}
    .topbar-title{font-size:1.05rem;font-weight:600}
    .topbar-user{display:flex;align-items:center;gap:.75rem}
    .avatar{width:36px;height:36px;border-radius:999px;background:linear-gradient(135deg,#00d2ff,#3a7bd5);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0}
    .content{padding:2rem}
    .page-head{margin-bottom:2rem}
    .page-title{font-size:1.6rem;font-weight:700;margin-bottom:.3rem}
    .page-sub{color:#a0aec0;font-size:.875rem}
    .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1.25rem;margin-bottom:2rem}
    .stat-card{background:rgba(17,19,24,0.8);border:1px solid rgba(255,255,255,0.07);border-radius:14px;padding:1.25rem;text-align:center;backdrop-filter:blur(10px)}
    .stat-icon{font-size:1.75rem;margin-bottom:.5rem}
    .stat-lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:1px;color:#4a5568;font-weight:600;margin-bottom:.4rem}
    .stat-val{font-size:1.6rem;font-weight:700}
    .card{background:rgba(17,19,24,0.8);border:1px solid rgba(255,255,255,0.07);border-radius:16px;padding:1.5rem;margin-bottom:1.5rem;backdrop-filter:blur(10px)}
    .card-title{font-size:1.05rem;font-weight:700;margin-bottom:1.25rem;padding-bottom:.75rem;border-bottom:1px solid rgba(255,255,255,0.07);display:flex;align-items:center;justify-content:space-between}
    table{width:100%;border-collapse:collapse}
    th{padding:.6rem 1rem;text-align:left;font-size:.7rem;font-weight:600;color:#4a5568;text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid rgba(255,255,255,0.06)}
    td{padding:.7rem 1rem;border-bottom:1px solid rgba(255,255,255,0.04);color:#a0aec0;font-size:.875rem}
    tr:last-child td{border-bottom:none}
    .badge{display:inline-block;padding:.2rem .65rem;border-radius:20px;font-size:.72rem;font-weight:600}
    .btn-sm-outline{padding:.35rem .75rem;border-radius:6px;font-size:.78rem;font-weight:600;cursor:pointer;transition:all .2s;border:1px solid;background:transparent}
    .actions-row{display:flex;gap:.75rem;margin-top:1rem}
    .btn-action{padding:.65rem 1.25rem;border-radius:10px;font-size:.875rem;font-weight:600;cursor:pointer;transition:all .2s;border:none}
    .btn-cyan{background:linear-gradient(135deg,#00d2ff,#3a7bd5);color:#fff}
    .btn-cyan:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,210,255,.35)}
    .btn-ghost{background:rgba(255,255,255,0.05);color:#a0aec0;border:1px solid rgba(255,255,255,0.1)}
    .btn-ghost:hover{background:rgba(255,255,255,0.09);color:#fff}
    @media(max-width:768px){.sidebar{display:none}.content{padding:1rem}}
</style>
</head>
<body>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <span class="sidebar-logo">VendorHub</span>
      </div>
      <nav class="sidebar-nav-items">
        <a href="dashboard.html" class="sidebar-link active"><span>📊</span> Dashboard</a>
        <a href="inventory.html" class="sidebar-link "><span>📦</span> Inventory</a>
        <a href="add-product.html" class="sidebar-link "><span>➕</span> Add Product</a>
        <a href="../buyer/shop.html" class="sidebar-link"><span>🛍</span> View Store</a>
      </nav>
      <button class="sidebar-logout" onclick="doLogout()">🚪 Logout</button>
    </aside>
  <div class="main">
    <div class="topbar">
      <span class="topbar-title">Seller Dashboard</span>
      <div class="topbar-user">
        <div class="avatar" id="userAvatar">S</div>
        <span id="userName" style="font-size:.875rem;color:#a0aec0">Seller</span>
      </div>
    </div>
    <div class="content">
      <div class="page-head">
        <h1 class="page-title">Welcome back, <span id="sellerName" style="background:linear-gradient(135deg,#00d2ff,#3a7bd5);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">Seller</span>!</h1>
        <p class="page-sub" id="todayDate"></p>
      </div>
      <div class="stats-grid" id="statsGrid">
        <div class="stat-card"><div class="stat-icon">💰</div><div class="stat-lbl">Total Revenue</div><div class="stat-val" style="color:#00d2ff" id="statRevenue">—</div></div>
        <div class="stat-card"><div class="stat-icon">📦</div><div class="stat-lbl">Total Orders</div><div class="stat-val" style="color:#3a7bd5" id="statOrders">—</div></div>
        <div class="stat-card"><div class="stat-icon">🛍</div><div class="stat-lbl">Active Products</div><div class="stat-val" style="color:#10b981" id="statProducts">—</div></div>
        <div class="stat-card"><div class="stat-icon">⏳</div><div class="stat-lbl">Pending Orders</div><div class="stat-val" style="color:#f59e0b" id="statPending">—</div></div>
      </div>
      <div class="card">
        <div class="card-title"><span>📋 Recent Orders</span></div>
        <div style="overflow-x:auto"><table>
          <thead><tr><th>Order ID</th><th>Date</th><th>Amount</th><th>Status</th></tr></thead>
          <tbody id="ordersBody"><tr><td colspan="4" style="text-align:center;color:#4a5568;padding:2rem">Loading...</td></tr></tbody>
        </table></div>
      </div>
      <div class="card">
        <div class="card-title"><span>⚠️ Low Stock Alerts</span></div>
        <div id="lowStockList" style="color:#4a5568;font-size:.875rem">Loading...</div>
      </div>
      <div class="actions-row">
        <a href="add-product.html" class="btn-action btn-cyan">➕ Add Product</a>
        <a href="inventory.html" class="btn-action btn-ghost">📦 View Inventory</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { requireAuth, logout } from '../../assets/js/modules/auth-manager.js';
    import { ProductsAPI, OrdersAPI } from '../../assets/js/modules/api-service.js';

    window.doLogout = () => logout();
    const session = requireAuth(['seller']);
    if (!session) throw new Error('auth');

    document.getElementById('userName').textContent = session.name||'Seller';
    document.getElementById('sellerName').textContent = session.name||'Seller';
    document.getElementById('userAvatar').textContent = (session.name||'S').charAt(0).toUpperCase();
    document.getElementById('todayDate').textContent = new Intl.DateTimeFormat('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'}).format(new Date());

    function fmt(n){return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n||0);}
    function fmtD(d){return new Intl.DateTimeFormat('en-US',{month:'short',day:'numeric',year:'numeric'}).format(new Date(d));}
    const statusColor = {Placed:'#00d2ff',Shipped:'#f59e0b',Delivered:'#10b981',Cancelled:'#ef4444'};

    (async()=>{
      try {
        const [products, orders] = await Promise.all([
          ProductsAPI.getByVendor(session.uid),
          OrdersAPI.getByVendor(session.uid)
        ]);
        document.getElementById('statProducts').textContent = products.length;
        document.getElementById('statOrders').textContent   = orders.length;
        document.getElementById('statPending').textContent  = orders.filter(o=>o.status==='Placed').length;
        document.getElementById('statRevenue').textContent  = fmt(orders.filter(o=>o.status==='Delivered').reduce((s,o)=>s+o.totalAmount,0));
        const recent = orders.slice(0,5);
        document.getElementById('ordersBody').innerHTML = recent.length
          ? recent.map(o=>`<tr><td style="font-family:monospace;color:#00d2ff">#${o.id.slice(-6).toUpperCase()}</td><td>${fmtD(o.createdAt)}</td><td>${fmt(o.totalAmount)}</td><td><span class="badge" style="background:${(statusColor[o.status]||'#a0aec0')}20;color:${statusColor[o.status]||'#a0aec0'};border:1px solid ${(statusColor[o.status]||'#a0aec0')}40">${o.status}</span></td></tr>`).join('')
          : '<tr><td colspan="4" style="text-align:center;color:#4a5568;padding:2rem">No orders yet.</td></tr>';
        const lowStock = products.filter(p=>(p.stock||0)<5);
        document.getElementById('lowStockList').innerHTML = lowStock.length
          ? '<div style="display:flex;flex-direction:column;gap:.6rem">'+lowStock.map(p=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:.65rem 1rem;background:rgba(245,158,11,0.07);border:1px solid rgba(245,158,11,0.15);border-radius:8px"><span>${p.name}</span><span style="color:#f59e0b;font-weight:600">${p.stock||0} left</span></div>`).join('')+'</div>'
          : '<p style="color:#10b981">✓ All products have sufficient stock.</p>';
      } catch(e){ console.error(e); }
    })();
  </script>
</body>
</html>
