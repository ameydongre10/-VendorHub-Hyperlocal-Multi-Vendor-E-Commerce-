<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product - VendorHub</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="../../assets/css/dashboard.css">
</head>
<body>
    <div class="dashboard-container">
        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="inventory.html">Inventory</a>
            <a href="#" id="logout-btn">Logout</a>
        </nav>
        
        <main>
            <h2>Add New Product</h2>
            <form id="add-product-form">
                <input type="text" id="p-name" placeholder="Product Name" required>
                <textarea id="p-desc" placeholder="Description" required></textarea>
                <input type="number" id="p-price" placeholder="Price" required>
                <input type="number" id="p-stock" placeholder="Initial Stock" required>
                <input type="text" id="p-category" placeholder="Category" required>
                
                <div class="upload-section">
                    <input type="file" id="p-image" accept="image/*" required>
                    <div id="image-preview" style="margin-top:10px; border:1px dashed #ccc; padding:10px; min-height:50px;">
                        No image selected
                    </div>
                </div>

                <button type="submit" id="submit-btn" style="margin-top:20px;">List Product</button>
            </form>
            <div id="status-msg" style="display:none; margin-top:20px; padding:10px; color:white; border-radius:4px;"></div>
        </main>
    </div>

    <script type="module">
        import { addProduct } from "../../assets/js/modules/products.js";
        import { logoutUser, checkAuthState } from "../../assets/js/modules/auth.js";

        let currentUser = null;
        const statusMsg = document.getElementById('status-msg');

        // Check Session
        checkAuthState((user) => {
            if (user && user.role === 'seller') {
                currentUser = user;
            } else {
                window.location.href = "../auth/login.html";
            }
        });

        // Image Preview Logic
        document.getElementById('p-image').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    document.getElementById('image-preview').innerHTML =
                        `<img src="${event.target.result}" style="max-width:150px; border-radius:8px;">`;
                }
                reader.readAsDataURL(file);
            }
        });

        // Form Submit Logic
        document.getElementById('add-product-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerText = "UPLOADING TO CLOUD...";

            try {
                const productData = {
                    name: document.getElementById('p-name').value,
                    description: document.getElementById('p-desc').value,
                    price: parseFloat(document.getElementById('p-price').value),
                    stock: parseInt(document.getElementById('p-stock').value),
                    category: document.getElementById('p-category').value,
                    // Use the OR (||) operator to provide a fallback string
                    vendorId: currentUser.uid || "unknown_id",
                    vendorName: currentUser.name || "Local Vendor" 
                };

                const imageFile = document.getElementById('p-image').files[0];
                const res = await addProduct(productData, imageFile);

                if(res.success) {
                    statusMsg.style.display = "block";
                    statusMsg.style.backgroundColor = "#4CAF50";
                    statusMsg.innerHTML = "SUCCESS: PRODUCT_LISTED";
                    
                    document.getElementById('add-product-form').reset();
                    document.getElementById('image-preview').innerHTML = "No image selected";
                    
                    setTimeout(() => { window.location.href = "inventory.html"; }, 1500);
                } else {
                    throw new Error(res.error);
                }

            } catch (error) {
                statusMsg.style.display = "block";
                statusMsg.style.backgroundColor = "#f44336";
                statusMsg.innerHTML = "ERROR: " + error.message;
                btn.disabled = false;
                btn.innerText = "List Product";
            }
        });

        document.getElementById('logout-btn').addEventListener('click', (e) => {
            e.preventDefault();
            logoutUser().then(() => window.location.href = "../auth/login.html");
        });
    </script>
</body>
</html>
