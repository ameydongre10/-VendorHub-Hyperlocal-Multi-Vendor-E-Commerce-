<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Orders - VendorHub</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <style>
        .order-card { border: 1px solid #ddd; padding: 1rem; margin-bottom: 1rem; border-radius: 8px; }
        .status-tag { padding: 4px 8px; border-radius: 4px; font-weight: bold; }
        .status-placed { background: #e3f2fd; color: #1976d2; }
        .status-shipped { background: #fff3e0; color: #f57c00; }
        .status-delivered { background: #e8f5e9; color: #388e3c; }
    </style>
</head>
<body>
    <header><h1>My Orders</h1><nav><a href="shop.html">Back to Shop</a></nav></header>
    <main id="orders-list" class="dashboard-container">
        <p>Loading orders...</p>
    </main>

    <script type="module">
        import { db } from "../../assets/js/config/firebase-config.js";
        import { collection, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { checkAuthState } from "../../assets/js/modules/auth.js";

        checkAuthState(async (user) => {
            if (!user) { window.location.href = "../auth/login.html"; return; }
            
            const q = query(collection(db, "orders"), where("buyerId", "==", user.uid));
            const snapshot = await getDocs(q);
            const container = document.getElementById('orders-list');
            
            if (snapshot.empty) {
                container.innerHTML = "<p>You haven't placed any orders yet.</p>";
                return;
            }

            container.innerHTML = snapshot.docs.map(doc => {
                const data = doc.data();
                return `
                    <div class="order-card">
                        <p><strong>Order ID:</strong> ${doc.id}</p>
                        <p><strong>Total:</strong> $${data.totalAmount.toFixed(2)}</p>
                        <p><strong>Status:</strong> <span class="status-tag status-${data.status.toLowerCase()}">${data.status}</span></p>
                        <a href="track-order.html?orderId=${doc.id}">Track Details</a>
                    </div>
                `;
            }).join('');
        });
    </script>
</body>
</html>
