<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - VendorHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
    <style>
        .order-card-buyer {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 1.5rem;
            margin-bottom: 1.25rem;
            box-shadow: var(--card-shadow);
            transition: transform 0.2s, border-color 0.2s;
        }

        .order-card-buyer:hover {
            transform: translateY(-2px);
            border-color: var(--accent-primary);
        }

        .order-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: 12px;
            margin-bottom: 12px;
        }

        .order-card-body {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="nav-container">
            <a href="../../index.html" class="brand-logo">
                VendorHub <span class="brand-badge">HYPERLOCAL</span>
            </a>

            <nav>
                <ul class="nav-links">
                    <li><a href="shop.html">🛍️ Shop</a></li>
                    <li><a href="all-orders.html" class="active">📦 My Orders</a></li>
                    <li>
                        <a href="cart.html" class="cart-link">
                            🛒 Cart <span id="navbar-cart-count" class="cart-badge" style="display:none;">0</span>
                        </a>
                    </li>
                    <li><button id="theme-toggle" class="theme-toggle-btn">🌓 Theme</button></li>
                    <li id="auth-action-container"></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="dashboard-container" style="max-width: 1000px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 2rem;">
            <div>
                <h2>Your Purchase History</h2>
                <p style="color:var(--text-muted)">Track and review your past orders from local merchants</p>
            </div>
            <a href="shop.html" style="font-weight: 600;">Explore Products →</a>
        </div>

        <div id="orders-list-container">
            <p style="padding: 3rem; text-align: center; color: var(--accent-primary);">Querying your personal order ledger...</p>
        </div>
    </main>

    <script type="module">
        import { getBuyerOrders } from "../../assets/js/modules/orders.js";
        import { checkAuthState, logoutUser } from "../../assets/js/modules/auth.js";
        import { getCartCount } from "../../assets/js/modules/cart.js";
        import { initTheme, toggleTheme } from "../../assets/js/utils/theme-handler.js";
        import { initParallax } from "../../assets/js/utils/parallax.js";
        import { showToast, formatCurrency, formatDate, escapeHtml } from "../../assets/js/utils/helpers.js";

        initTheme();
        initParallax();

        document.getElementById('theme-toggle').addEventListener('click', toggleTheme);

        // Header Auth & Cart Setup
        const authContainer = document.getElementById('auth-action-container');
        const container = document.getElementById('orders-list-container');

        checkAuthState(async (user) => {
            if (!user) {
                authContainer.innerHTML = `<a href="../auth/login.html" class="btn-primary" style="padding:6px 14px; font-size:0.8rem;">Login</a>`;
                container.innerHTML = `
                    <div class="empty-state-box">
                        <div class="empty-state-icon">🔒</div>
                        <h3>Authentication Required</h3>
                        <p>Sign in to view your orders, delivery progress, and invoices.</p>
                        <a href="../auth/login.html" class="empty-state-btn">Sign In to VendorHub</a>
                    </div>
                `;
                return;
            }

            authContainer.innerHTML = `
                <span style="font-size:0.9rem; color:var(--text-muted); margin-right:6px;">Hi, ${escapeHtml(user.name || 'User')}</span>
                <button id="logout-btn" style="background:transparent; border:none; color:var(--danger); font-weight:700; cursor:pointer; font-size:0.85rem;">Logout</button>
            `;
            document.getElementById('logout-btn').addEventListener('click', () => {
                logoutUser().then(() => window.location.reload());
            });

            const badge = document.getElementById('navbar-cart-count');
            const count = getCartCount();
            if (badge) {
                badge.textContent = count;
                badge.style.display = count > 0 ? 'inline-block' : 'none';
            }

            try {
                const orders = await getBuyerOrders(user.uid);

                if (orders.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state-box">
                            <div class="empty-state-icon">📦</div>
                            <h3>No Orders Placed Yet</h3>
                            <p>You haven't purchased anything yet. Support your local vendors and place your first order!</p>
                            <a href="shop.html" class="empty-state-btn">Start Shopping</a>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = orders.map(order => {
                    const status = order.status || 'Placed';
                    const items = order.items || [];
                    const itemCount = items.reduce((acc, i) => acc + (typeof i === 'object' ? (i.quantity || 1) : 1), 0);
                    const totalFormatted = formatCurrency(order.totalAmount);

                    return `
                        <div class="order-card-buyer">
                            <div class="order-card-header">
                                <div>
                                    <strong style="font-size:1.1rem; color:var(--text-primary)">Order #${escapeHtml(order.id.slice(-8))}</strong>
                                    <span style="display:block; font-size:0.85rem; color:var(--text-muted); margin-top:2px;">Placed on ${formatDate(order.createdAt)}</span>
                                </div>
                                <div>
                                    <span class="status-tag status-${escapeHtml(status.toLowerCase())}">${escapeHtml(status)}</span>
                                </div>
                            </div>

                            <div class="order-card-body">
                                <div>
                                    <div style="font-size:0.95rem; color:var(--text-secondary); margin-bottom:4px;">
                                        Total Assets: <strong>${itemCount} item${itemCount === 1 ? '' : 's'}</strong>
                                    </div>
                                    <div style="font-family:'Orbitron',sans-serif; color:var(--accent-primary); font-size:1.3rem; font-weight:700;">
                                        ${totalFormatted}
                                    </div>
                                </div>

                                <div>
                                    <a href="track-order.html?orderId=${escapeHtml(order.id)}" class="btn-card-details" style="padding:10px 18px; font-weight:700;">
                                        Track Progress →
                                    </a>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

                initParallax();
            } catch (err) {
                console.error("Error loading buyer orders:", err);
                container.innerHTML = `<p style="color:var(--danger)">Failed to load order history: ${err.message}</p>`;
            }
        });
    </script>
</body>
</html>
