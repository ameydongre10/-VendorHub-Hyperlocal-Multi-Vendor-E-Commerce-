<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details – VendorHub</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;background:#0a0b10;color:#fff;min-height:100vh}
    a{color:inherit;text-decoration:none}
    .nav{display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem;height:64px;background:rgba(10,11,16,0.9);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.06);position:sticky;top:0;z-index:50}
    .nav-brand{font-family:'Orbitron',sans-serif;font-size:1.1rem;font-weight:800;background:linear-gradient(135deg,#00d2ff,#3a7bd5);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .nav-actions{display:flex;align-items:center;gap:.75rem}
    .cart-btn{padding:.5rem .9rem;background:rgba(0,210,255,0.1);border:1px solid rgba(0,210,255,0.2);border-radius:8px;color:#00d2ff;font-size:.875rem;font-weight:600;display:flex;align-items:center;gap:.4rem}
    .cart-badge{background:#ef4444;color:#fff;border-radius:999px;font-size:.65rem;font-weight:700;padding:.1rem .35rem}
    .page{max-width:1100px;margin:0 auto;padding:2rem 1.5rem}
    .breadcrumb{display:flex;align-items:center;gap:.5rem;font-size:.82rem;color:#4a5568;margin-bottom:2rem}
    .breadcrumb a{color:#a0aec0;transition:color .2s}
    .breadcrumb a:hover{color:#00d2ff}
    .breadcrumb span{color:#4a5568}
    .product-layout{display:grid;grid-template-columns:1fr 1fr;gap:2.5rem;align-items:start}
    .product-image-wrap{position:relative;border-radius:20px;overflow:hidden;background:rgba(17,19,24,0.8);border:1px solid rgba(255,255,255,0.07)}
    .product-image-wrap img{width:100%;aspect-ratio:4/3;object-fit:cover}
    .category-pill{position:absolute;top:1rem;left:1rem;background:rgba(0,210,255,0.15);color:#00d2ff;border:1px solid rgba(0,210,255,0.3);padding:.3rem .75rem;border-radius:20px;font-size:.78rem;font-weight:500}
    .product-info{}
    .product-name{font-size:1.75rem;font-weight:700;line-height:1.3;margin-bottom:.75rem}
    .stars{display:flex;align-items:center;gap:.5rem;margin-bottom:1rem}
    .star-display{color:#f59e0b;font-size:1.1rem}
    .star-count{color:#a0aec0;font-size:.85rem}
    .price-section{display:flex;align-items:baseline;gap:.5rem;margin-bottom:1.5rem}
    .price{font-size:2.5rem;font-weight:800;background:linear-gradient(135deg,#00d2ff,#3a7bd5);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .stock-badge{padding:.3rem .875rem;border-radius:20px;font-size:.82rem;font-weight:600}
    .stock-in{background:rgba(16,185,129,0.1);color:#10b981;border:1px solid rgba(16,185,129,0.25)}
    .stock-out{background:rgba(239,68,68,0.1);color:#ef4444;border:1px solid rgba(239,68,68,0.25)}
    .desc-section{background:rgba(17,19,24,0.7);border:1px solid rgba(255,255,255,0.07);border-radius:14px;padding:1.25rem;margin-bottom:1.5rem}
    .desc-title{font-size:.8rem;text-transform:uppercase;letter-spacing:1px;color:#4a5568;font-weight:600;margin-bottom:.6rem}
    .desc-text{color:#a0aec0;font-size:.9rem;line-height:1.7}
    .qty-section{display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem}
    .qty-label{font-size:.85rem;color:#a0aec0;font-weight:500}
    .qty-ctrl{display:flex;align-items:center;gap:0;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:8px;overflow:hidden}
    .qty-btn{padding:.5rem .875rem;background:none;border:none;color:#fff;font-size:1.1rem;cursor:pointer;transition:background .15s}
    .qty-btn:hover{background:rgba(255,255,255,0.08)}
    .qty-val{padding:.5rem .875rem;font-weight:600;min-width:44px;text-align:center}
    .btn-atc{flex:1;padding:.875rem;border-radius:10px;background:linear-gradient(135deg,#00d2ff,#3a7bd5);color:#fff;border:none;font-size:1rem;font-weight:700;cursor:pointer;transition:transform .2s,box-shadow .2s}
    .btn-atc:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,210,255,.4)}
    .btn-atc:disabled{opacity:.5;cursor:not-allowed}
    .actions-row{display:flex;gap:1rem}
    .vendor-card{background:rgba(17,19,24,0.7);border:1px solid rgba(255,255,255,0.07);border-radius:14px;padding:1.25rem;margin-top:1.5rem}
    .vendor-label{font-size:.78rem;text-transform:uppercase;letter-spacing:1px;color:#4a5568;font-weight:600;margin-bottom:.75rem}
    .vendor-info{display:flex;align-items:center;gap:.875rem}
    .vendor-avatar{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#00d2ff,#3a7bd5);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.1rem;flex-shrink:0}
    .vendor-name{font-weight:600}
    .vendor-meta{font-size:.78rem;color:#a0aec0;margin-top:.2rem}
    .related-section{margin-top:3rem}
    .section-head{font-size:1.2rem;font-weight:700;margin-bottom:1.25rem;padding-bottom:.75rem;border-bottom:1px solid rgba(255,255,255,0.07)}
    .related-placeholder{background:rgba(17,19,24,0.6);border:1px solid rgba(255,255,255,0.06);border-radius:14px;padding:2rem;text-align:center;color:#4a5568;font-size:.875rem}
    .loading-wrap{text-align:center;padding:4rem}
    .spinner{width:40px;height:40px;border:3px solid rgba(0,210,255,0.15);border-top-color:#00d2ff;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 1rem}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:768px){.product-layout{grid-template-columns:1fr}.actions-row{flex-direction:column}}
  </style>
</head>
<body>
  <nav class="nav">
    <a href="../../index.html" class="nav-brand">VendorHub</a>
    <div class="nav-actions">
      <a href="cart.html" class="cart-btn">🛒 Cart <span class="cart-badge" data-cart-count style="display:none">0</span></a>
    </div>
  </nav>

  <div class="page">
    <div class="breadcrumb">
      <a href="../../index.html">Home</a>
      <span>›</span>
      <a href="shop.html">Marketplace</a>
      <span>›</span>
      <span id="breadcrumbName">Product</span>
    </div>

    <div id="loadingWrap" class="loading-wrap">
      <div class="spinner"></div>
      <p style="color:#4a5568">Loading product...</p>
    </div>

    <div id="productContent" style="display:none">
      <div class="product-layout">
        <div class="product-image-wrap">
          <img id="productImage" src="" alt="Product">
          <div class="category-pill" id="categoryPill"></div>
        </div>
        <div class="product-info">
          <h1 class="product-name" id="productName"></h1>
          <div class="stars">
            <span class="star-display">★★★★☆</span>
            <span class="star-count">(4.0 · 12 reviews)</span>
          </div>
          <div class="price-section">
            <span class="price" id="productPrice"></span>
            <span class="stock-badge" id="stockBadge"></span>
          </div>
          <div class="desc-section">
            <p class="desc-title">Description</p>
            <p class="desc-text" id="productDesc"></p>
          </div>
          <div class="qty-section">
            <span class="qty-label">Quantity</span>
            <div class="qty-ctrl">
              <button class="qty-btn" onclick="changeQty(-1)">−</button>
              <span class="qty-val" id="qtyVal">1</span>
              <button class="qty-btn" onclick="changeQty(1)">+</button>
            </div>
          </div>
          <div class="actions-row">
            <button class="btn-atc" id="addCartBtn" onclick="doAddToCart()">🛒 Add to Cart</button>
          </div>
          <div class="vendor-card">
            <p class="vendor-label">Sold by</p>
            <div class="vendor-info">
              <div class="vendor-avatar" id="vendorAvatar">V</div>
              <div>
                <div class="vendor-name" id="vendorName">Local Vendor</div>
                <div class="vendor-meta" id="vendorMeta">Verified Seller</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="related-section">
        <h2 class="section-head">You might also like</h2>
        <div class="related-placeholder">🔗 Related products will appear here based on category.</div>
      </div>
    </div>
  </div>

  <script type="module">
    import { ProductsAPI } from '../../assets/js/modules/api-service.js';
    import { addToCart, updateCartBadge, getCartCount } from '../../assets/js/modules/cart.js';
    import { showSuccess, showToast } from '../../assets/js/modules/error-handler.js';

    updateCartBadge();
    let qty = 1;
    let currentProduct = null;

    window.changeQty = function(d) {
      qty = Math.max(1, qty + d);
      document.getElementById('qtyVal').textContent = qty;
    };

    window.doAddToCart = function() {
      if (!currentProduct) return;
      for (let i = 0; i < qty; i++) addToCart(currentProduct);
      showSuccess(`${qty}× "${currentProduct.name}" added to cart!`);
      updateCartBadge();
    };

    const id = new URLSearchParams(window.location.search).get('id');
    if (!id) { window.location.href = 'shop.html'; }
    else {
      (async () => {
        try {
          const p = await ProductsAPI.getById(id);
          if (!p) { showToast('Product not found.','error'); setTimeout(()=>window.location.href='shop.html',2000); return; }
          currentProduct = p;
          document.getElementById('breadcrumbName').textContent = p.name || 'Product';
          document.title = (p.name||'Product') + ' – VendorHub';
          const img = p.image || `https://placehold.co/600x450/111318/00d2ff?text=${encodeURIComponent(p.name||'Product')}`;
          document.getElementById('productImage').src = img;
          document.getElementById('productImage').onerror = function(){ this.src='https://placehold.co/600x450/111318/00d2ff?text=No+Image'; };
          const icons = {'electronics':'💻','food':'🍔','fashion':'👕','home':'🏠','beauty':'💄','sports':'⚽','books':'📚'};
          const icon = icons[p.category?.toLowerCase()]||'📦';
          document.getElementById('categoryPill').textContent = icon+' '+(p.category||'General');
          document.getElementById('productName').textContent = p.name||'Unnamed Product';
          document.getElementById('productPrice').textContent = new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(p.price||0);
          const badge = document.getElementById('stockBadge');
          if (p.stock > 0) { badge.textContent = '✓ In Stock ('+p.stock+')'; badge.className='stock-badge stock-in'; }
          else { badge.textContent='✕ Out of Stock'; badge.className='stock-badge stock-out'; document.getElementById('addCartBtn').disabled=true; }
          document.getElementById('productDesc').textContent = p.description||'No description available for this product.';
          if (p.vendorId) { document.getElementById('vendorAvatar').textContent = (p.vendorId||'V').charAt(0).toUpperCase(); document.getElementById('vendorMeta').textContent = 'Vendor ID: '+p.vendorId.slice(-8); }
          document.getElementById('loadingWrap').style.display='none';
          document.getElementById('productContent').style.display='block';
        } catch(e) { document.getElementById('loadingWrap').innerHTML='<p style="color:#ef4444">Failed to load product.</p>'; }
      })();
    }
  </script>
</body>
</html>
