<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Order – VendorHub</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;background:#0a0b10;color:#fff;min-height:100vh}
    a{color:inherit;text-decoration:none}
    .nav{display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem;height:64px;background:rgba(10,11,16,0.9);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.06);position:sticky;top:0;z-index:50}
    .nav-brand{font-family:'Orbitron',sans-serif;font-size:1.1rem;font-weight:800;background:linear-gradient(135deg,#00d2ff,#3a7bd5);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .page{max-width:760px;margin:0 auto;padding:2rem 1.5rem}
    .back-link{display:inline-flex;align-items:center;gap:.4rem;color:#a0aec0;font-size:.85rem;margin-bottom:1.75rem;transition:color .2s}
    .back-link:hover{color:#fff}
    .order-header{background:rgba(17,19,24,0.8);border:1px solid rgba(255,255,255,0.07);border-radius:16px;padding:1.5rem;margin-bottom:1.5rem;backdrop-filter:blur(10px)}
    .order-id{font-family:monospace;font-size:1.4rem;font-weight:700;color:#00d2ff;margin-bottom:.5rem}
    .order-meta{color:#a0aec0;font-size:.875rem;display:flex;gap:1.5rem;flex-wrap:wrap}
    .status-badge{display:inline-flex;align-items:center;padding:.3rem .9rem;border-radius:20px;font-size:.82rem;font-weight:600;margin-top:.75rem}
    .timeline{background:rgba(17,19,24,0.8);border:1px solid rgba(255,255,255,0.07);border-radius:16px;padding:2rem;margin-bottom:1.5rem;backdrop-filter:blur(10px)}
    .timeline-title{font-size:1.05rem;font-weight:700;margin-bottom:1.75rem}
    .timeline-steps{position:relative}
    .timeline-line{position:absolute;left:17px;top:20px;bottom:20px;width:2px;background:rgba(255,255,255,0.07)}
    .timeline-line-fill{position:absolute;left:17px;top:20px;width:2px;background:linear-gradient(180deg,#00d2ff,#3a7bd5);transition:height .6s ease}
    .step{display:flex;align-items:flex-start;gap:1rem;position:relative;z-index:1;margin-bottom:1.75rem}
    .step:last-child{margin-bottom:0}
    .step-dot{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.9rem;flex-shrink:0;transition:all .3s;border:2px solid rgba(255,255,255,0.1);background:#0a0b10}
    .step-dot.done{background:linear-gradient(135deg,#00d2ff,#3a7bd5);border-color:transparent}
    .step-dot.active{background:rgba(0,210,255,0.1);border-color:#00d2ff;box-shadow:0 0 12px rgba(0,210,255,.3)}
    .step-content{}
    .step-title{font-weight:600;font-size:.9rem;margin-bottom:.2rem}
    .step-desc{font-size:.78rem;color:#a0aec0}
    .step-time{font-size:.72rem;color:#4a5568;margin-top:.2rem}
    .order-details{background:rgba(17,19,24,0.8);border:1px solid rgba(255,255,255,0.07);border-radius:16px;padding:1.5rem;backdrop-filter:blur(10px)}
    .details-title{font-size:1.05rem;font-weight:700;margin-bottom:1.25rem;padding-bottom:.75rem;border-bottom:1px solid rgba(255,255,255,0.07)}
    .detail-row{display:flex;justify-content:space-between;align-items:center;padding:.6rem 0;border-bottom:1px solid rgba(255,255,255,0.04);font-size:.875rem}
    .detail-row:last-child{border-bottom:none}
    .detail-label{color:#a0aec0}
    .detail-total{font-size:1rem;font-weight:700;color:#00d2ff}
    .loading-wrap{text-align:center;padding:4rem;color:#4a5568}
    .spinner{width:40px;height:40px;border:3px solid rgba(0,210,255,0.15);border-top-color:#00d2ff;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 1rem}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <nav class="nav">
    <a href="../../index.html" class="nav-brand">VendorHub</a>
    <a href="all-orders.html" style="color:#a0aec0;font-size:.875rem">My Orders</a>
  </nav>

  <div class="page">
    <a href="all-orders.html" class="back-link">← Back to Orders</a>

    <div id="loadingWrap" class="loading-wrap">
      <div class="spinner"></div>
      <p>Loading order details...</p>
    </div>

    <div id="orderContent" style="display:none">
      <div class="order-header">
        <div class="order-id" id="orderId"></div>
        <div class="order-meta">
          <span id="orderDate"></span>
          <span id="orderItems"></span>
        </div>
        <div class="status-badge" id="statusBadge"></div>
      </div>

      <div class="timeline">
        <h2 class="timeline-title">📦 Order Timeline</h2>
        <div class="timeline-steps" id="timelineSteps">
          <div class="timeline-line"></div>
          <div class="timeline-line-fill" id="timelineFill" style="height:0"></div>
        </div>
      </div>

      <div class="order-details">
        <h2 class="details-title">Order Details</h2>
        <div class="detail-row"><span class="detail-label">Order ID</span><span id="detailId" style="font-family:monospace;color:#00d2ff"></span></div>
        <div class="detail-row"><span class="detail-label">Placed On</span><span id="detailDate"></span></div>
        <div class="detail-row"><span class="detail-label">Status</span><span id="detailStatus"></span></div>
        <div class="detail-row"><span class="detail-label">Items</span><span id="detailItems"></span></div>
        <div class="detail-row"><span class="detail-label">Total</span><span class="detail-total" id="detailTotal"></span></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { OrdersAPI } from '../../assets/js/modules/api-service.js';
    import { showToast } from '../../assets/js/modules/error-handler.js';

    const STATUS_STEPS = ['Placed','Processing','Shipped','Delivered'];
    const STEP_ICONS   = ['📋','⚙️','🚚','✅'];
    const STEP_DESCS   = ['Order confirmed and received','Being prepared by the seller','On the way to you','Successfully delivered'];
    const STATUS_COLORS = {Placed:'#00d2ff',Processing:'#f59e0b',Shipped:'#3a7bd5',Delivered:'#10b981',Cancelled:'#ef4444'};

    function fmt(n){ return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n||0); }
    function fmtDate(d){ return new Intl.DateTimeFormat('en-US',{month:'short',day:'numeric',year:'numeric'}).format(new Date(d)); }

    const id = new URLSearchParams(window.location.search).get('id');
    if (!id) { window.location.href='all-orders.html'; }
    else {
      (async()=>{
        try {
          const order = await OrdersAPI.getById(id);
          if (!order){ showToast('Order not found.','error'); setTimeout(()=>window.location.href='all-orders.html',2e3); return; }
          const color = STATUS_COLORS[order.status]||'#a0aec0';
          document.getElementById('orderId').textContent = '#'+order.id.slice(-8).toUpperCase();
          document.getElementById('orderDate').textContent = 'Placed: '+fmtDate(order.createdAt);
          document.getElementById('orderItems').textContent = (order.productIds?.length||0)+' item(s)';
          const badge = document.getElementById('statusBadge');
          badge.textContent = order.status;
          badge.style.cssText = `background:${color}18;color:${color};border:1px solid ${color}44;display:inline-flex;align-items:center;padding:.3rem .9rem;border-radius:20px;font-size:.82rem;font-weight:600;margin-top:.75rem`;
          const stepIdx = STATUS_STEPS.indexOf(order.status);
          const container = document.getElementById('timelineSteps');
          STATUS_STEPS.forEach((step,i)=>{
            const done   = i < stepIdx;
            const active = i === stepIdx;
            const div    = document.createElement('div');
            div.className = 'step';
            div.innerHTML = `
              <div class="step-dot ${done?'done':active?'active':''}">${done?'✓':STEP_ICONS[i]}</div>
              <div class="step-content">
                <div class="step-title" style="color:${done||active?'#fff':'#4a5568'}">${step}</div>
                <div class="step-desc">${STEP_DESCS[i]}</div>
                ${done||active?'<div class="step-time">'+fmtDate(order.createdAt)+'</div>':''}
              </div>`;
            container.appendChild(div);
          });
          if (stepIdx>0){ const pct = Math.min(100,(stepIdx/(STATUS_STEPS.length-1))*100); document.getElementById('timelineFill').style.height=pct+'%'; }
          document.getElementById('detailId').textContent = '#'+order.id.slice(-8).toUpperCase();
          document.getElementById('detailDate').textContent = fmtDate(order.createdAt);
          document.getElementById('detailStatus').textContent = order.status;
          document.getElementById('detailItems').textContent = (order.productIds?.length||0)+' item(s)';
          document.getElementById('detailTotal').textContent = fmt(order.totalAmount);
          document.getElementById('loadingWrap').style.display='none';
          document.getElementById('orderContent').style.display='block';
        } catch(e){ document.getElementById('loadingWrap').innerHTML='<p style="color:#ef4444">Failed to load order.</p>'; }
      })();
    }
  </script>
</body>
</html>
