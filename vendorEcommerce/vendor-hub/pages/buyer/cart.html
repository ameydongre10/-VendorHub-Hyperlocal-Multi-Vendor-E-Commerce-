<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart – VendorHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/design-system.css">
    <link rel="stylesheet" href="../../assets/css/responsive.css">
    <style>
        .topbar {
            position: sticky;
            top: 0;
            z-index: 40;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 24px;
            background: rgba(7,10,18,0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--glass-border);
        }

        .brand-link {
            font-family: var(--font-display);
            font-size: 1rem;
            color: var(--accent-primary);
            text-transform: uppercase;
            letter-spacing: 3px;
            text-decoration: none;
        }

        .page-body {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 24px;
        }

        .order-summary-card {
            background: var(--glass-fill);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: 28px;
            position: sticky;
            top: 80px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 0.9rem;
        }

        .summary-row:last-child { border-bottom: none; }

        .summary-row.total {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent-primary);
            padding-top: 16px;
        }

        .cart-item-info { flex: 1; min-width: 0; }
        .cart-item-name { font-weight: 700; color: #fff; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .cart-item-price { font-size: 0.9rem; color: var(--accent-primary); font-weight: 600; }
        .cart-item-vendor { font-size: 0.75rem; color: var(--text-muted); }
    </style>
</head>
<body>

    <header class="topbar" role="banner">
        <a href="shop.html" class="brand-link" aria-label="Back to shop">← Shop</a>
        <h1 style="font-family:var(--font-display);font-size:1rem;letter-spacing:3px;color:#fff;">YOUR CART</h1>
        <span></span>
    </header>

    <main class="page-body" role="main">
        <div class="cart-layout">

            <!-- Cart Items -->
            <div>
                <div id="cart-items" aria-label="Cart items" aria-live="polite"></div>
                <div id="cart-empty" class="empty-state hidden">
                    <div class="empty-icon">🛒</div>
                    <p>Your cart is empty.</p>
                    <a href="shop.html" class="btn btn-outline btn-sm mt-md">Browse Products</a>
                </div>
            </div>

            <!-- Order Summary -->
            <div id="cart-summary" class="order-summary-card hidden" aria-label="Order summary">
                <h3 style="margin-bottom:20px;font-family:var(--font-body);text-transform:none;letter-spacing:0;">Order Summary</h3>

                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="cart-subtotal" style="color:#fff">$0.00</span>
                </div>
                <div class="summary-row">
                    <span>Shipping</span>
                    <span style="color:var(--success)">Free</span>
                </div>
                <div class="summary-row total">
                    <span>Total</span>
                    <span id="cart-total">$0.00</span>
                </div>

                <button
                    id="checkout-btn"
                    class="btn btn-primary btn-full mt-lg"
                    aria-label="Proceed to checkout">
                    Proceed to Checkout
                </button>
            </div>

        </div>
    </main>

    <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

    <script type="module">
        import { db } from "../../assets/js/config/firebase-config.js";
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { placeOrder } from "../../assets/js/modules/api-service.js";
        import { checkAuthState } from "../../assets/js/modules/auth.js";
        import {
            getCartIds,
            removeFromCartByIndex,
            clearCart,
            updateCartBadge,
        } from "../../assets/js/modules/cart.js";
        import {
            showToast,
            setButtonLoading,
            resetButton,
            handleError,
        } from "../../assets/js/modules/error-handler.js";
        import { formatCurrency, placeholderImg } from "../../assets/js/utils/helpers.js";

        let currentUser = null;
        let loadedProducts = [];

        // Auth guard
        checkAuthState((user) => {
            if (user) {
                currentUser = user;
                loadCart();
            } else {
                showToast('Please log in to view your cart.', 'info');
                setTimeout(() => { window.location.href = '../auth/login.html'; }, 1500);
            }
        });

        async function loadCart() {
            const ids = getCartIds();
            const itemsEl   = document.getElementById('cart-items');
            const emptyEl   = document.getElementById('cart-empty');
            const summaryEl = document.getElementById('cart-summary');

            itemsEl.innerHTML = '';
            loadedProducts = [];

            if (ids.length === 0) {
                emptyEl.classList.remove('hidden');
                summaryEl.classList.add('hidden');
                return;
            }

            emptyEl.classList.add('hidden');
            summaryEl.classList.remove('hidden');

            // Show skeleton
            itemsEl.innerHTML = Array.from({ length: ids.length }).map(() => `
                <div class="cart-item" style="animation:pulseGlow 1.5s infinite;">
                    <div style="width:70px;height:70px;background:var(--glass-fill);border-radius:var(--radius-sm);flex-shrink:0;"></div>
                    <div style="flex:1;padding-left:12px;">
                        <div style="height:14px;background:rgba(255,255,255,0.06);border-radius:4px;width:70%;margin-bottom:8px;"></div>
                        <div style="height:12px;background:rgba(0,210,255,0.08);border-radius:4px;width:40%;"></div>
                    </div>
                </div>`).join('');

            // Fetch product details
            let total = 0;
            const productPromises = ids.map(id => getDoc(doc(db, 'products', id)));
            const snaps = await Promise.all(productPromises);

            itemsEl.innerHTML = '';
            snaps.forEach((snap, idx) => {
                if (!snap.exists()) return;
                const p = { id: snap.id, ...snap.data() };
                loadedProducts.push(p);
                total += p.price || 0;

                const div = document.createElement('div');
                div.className = 'cart-item animate-in';
                div.dataset.index = idx;
                div.innerHTML = `
                    <img src="${escHtml(p.image || placeholderImg(70,70))}" alt="${escHtml(p.name)}"
                         onerror="this.src='${placeholderImg(70,70)}'">
                    <div class="cart-item-info">
                        <div class="cart-item-name">${escHtml(p.name)}</div>
                        <div class="cart-item-vendor">by ${escHtml(p.vendorName || 'Local Vendor')}</div>
                        <div class="cart-item-price">${formatCurrency(p.price)}</div>
                    </div>
                    <button class="btn btn-danger btn-sm" onclick="removeItem(${idx})" aria-label="Remove ${escHtml(p.name)} from cart">
                        ✕
                    </button>`;
                itemsEl.appendChild(div);
            });

            document.getElementById('cart-subtotal').textContent = formatCurrency(total);
            document.getElementById('cart-total').textContent     = formatCurrency(total);
        }

        window.removeItem = (index) => {
            removeFromCartByIndex(index);
            updateCartBadge();
            loadCart();
            showToast('Item removed from cart.', 'info');
        };

        document.getElementById('checkout-btn').addEventListener('click', async () => {
            if (!currentUser) {
                showToast('Please log in to checkout.', 'info');
                return;
            }

            const ids = getCartIds();
            if (ids.length === 0) { showToast('Your cart is empty.', 'warning'); return; }

            const btn = document.getElementById('checkout-btn');
            setButtonLoading(btn, 'Processing…');

            try {
                const total      = loadedProducts.reduce((s, p) => s + (p.price || 0), 0);
                const vendorIds  = [...new Set(loadedProducts.map(p => p.vendorId).filter(Boolean))];

                const res = await placeOrder(currentUser.uid, ids, total, vendorIds);

                if (res.success) {
                    clearCart();
                    updateCartBadge();
                    showToast('Order placed successfully! 🎉', 'success', 2000);
                    setTimeout(() => {
                        window.location.href = 'track-order.html?orderId=' + res.data.orderId;
                    }, 1200);
                } else {
                    throw new Error(res.error || 'Checkout failed');
                }
            } catch (error) {
                handleError(error, 'checkout');
                resetButton(btn);
            }
        });

        const escHtml = (str) => {
            const map = { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' };
            return String(str || '').replace(/[&<>"']/g, c => map[c]);
        };
    </script>
</body>
</html>
