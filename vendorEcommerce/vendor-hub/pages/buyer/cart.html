<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart – VendorHub</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;background:#0a0b10;color:#fff;min-height:100vh}
    a{color:inherit;text-decoration:none}
    .nav{display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem;height:64px;background:rgba(10,11,16,0.9);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.06);position:sticky;top:0;z-index:50}
    .nav-brand{font-family:'Orbitron',sans-serif;font-size:1.1rem;font-weight:800;background:linear-gradient(135deg,#00d2ff,#3a7bd5);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .page{max-width:1100px;margin:0 auto;padding:2rem 1.5rem}
    .page-title{font-size:1.75rem;font-weight:700;margin-bottom:1.75rem}
    .cart-layout{display:grid;grid-template-columns:1fr 360px;gap:1.5rem;align-items:start}
    .cart-items{display:flex;flex-direction:column;gap:1rem}
    .cart-item{display:flex;gap:1rem;background:rgba(17,19,24,0.8);border:1px solid rgba(255,255,255,0.07);border-radius:14px;padding:1.1rem;align-items:center}
    .item-img{width:80px;height:80px;border-radius:10px;object-fit:cover;flex-shrink:0}
    .item-info{flex:1;min-width:0}
    .item-name{font-weight:600;font-size:.95rem;margin-bottom:.25rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .item-cat{font-size:.75rem;color:#a0aec0;margin-bottom:.5rem}
    .item-price{font-size:1rem;font-weight:700;background:linear-gradient(135deg,#00d2ff,#3a7bd5);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .item-controls{display:flex;align-items:center;gap:.75rem;flex-shrink:0}
    .qty-ctrl{display:flex;align-items:center;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:8px;overflow:hidden}
    .qty-btn{padding:.35rem .75rem;background:none;border:none;color:#fff;font-size:1rem;cursor:pointer;transition:background .15s}
    .qty-btn:hover{background:rgba(255,255,255,0.08)}
    .qty-num{padding:.35rem .6rem;font-weight:600;min-width:36px;text-align:center;font-size:.9rem}
    .remove-btn{padding:.4rem .75rem;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.2);border-radius:8px;color:#ef4444;font-size:.8rem;cursor:pointer;transition:all .2s;white-space:nowrap}
    .remove-btn:hover{background:rgba(239,68,68,0.2)}
    .order-summary{background:rgba(17,19,24,0.8);border:1px solid rgba(255,255,255,0.07);border-radius:16px;padding:1.5rem;position:sticky;top:80px;backdrop-filter:blur(10px)}
    .summary-title{font-size:1.1rem;font-weight:700;margin-bottom:1.25rem;padding-bottom:.875rem;border-bottom:1px solid rgba(255,255,255,0.07)}
    .summary-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem;font-size:.9rem}
    .summary-row .label{color:#a0aec0}
    .summary-total{display:flex;justify-content:space-between;align-items:center;margin-top:1rem;padding-top:1rem;border-top:1px solid rgba(255,255,255,0.1);font-size:1.1rem;font-weight:700}
    .total-amount{background:linear-gradient(135deg,#00d2ff,#3a7bd5);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-size:1.4rem}
    .btn-checkout{width:100%;padding:.9rem;border-radius:10px;background:linear-gradient(135deg,#00d2ff,#3a7bd5);color:#fff;border:none;font-size:1rem;font-weight:700;cursor:pointer;margin-top:1.25rem;transition:transform .2s,box-shadow .2s}
    .btn-checkout:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 5px 18px rgba(0,210,255,.4)}
    .btn-checkout:disabled{opacity:.5;cursor:not-allowed}
    .btn-continue{display:block;text-align:center;margin-top:1rem;padding:.7rem;border-radius:10px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:#a0aec0;font-size:.875rem;transition:all .2s}
    .btn-continue:hover{background:rgba(255,255,255,0.09);color:#fff}
    .empty-state{text-align:center;padding:4rem;grid-column:1/-1}
    .empty-icon{font-size:4rem;margin-bottom:1rem}
    .empty-msg{color:#a0aec0;margin-bottom:1.5rem;font-size:1.05rem}
    .btn-shop{display:inline-block;padding:.8rem 2rem;border-radius:10px;background:linear-gradient(135deg,#00d2ff,#3a7bd5);color:#fff;font-weight:600;font-size:.95rem}
    @media(max-width:1024px){.cart-layout{grid-template-columns:1fr}}
    @media(max-width:600px){.cart-item{flex-wrap:wrap}.item-controls{width:100%;justify-content:space-between}}
  </style>
</head>
<body>
  <nav class="nav">
    <a href="../../index.html" class="nav-brand">VendorHub</a>
    <a href="shop.html" style="color:#a0aec0;font-size:.875rem">← Continue Shopping</a>
  </nav>

  <div class="page">
    <h1 class="page-title">Shopping Cart</h1>
    <div class="cart-layout" id="cartLayout">
      <div style="text-align:center;padding:3rem;color:#4a5568">Loading cart...</div>
    </div>
  </div>

  <script type="module">
    import { getCart, removeFromCart, updateQuantity, clearCart, getCartTotal, getCartCount } from '../../assets/js/modules/cart.js';
    import { OrdersAPI } from '../../assets/js/modules/api-service.js';
    import { getSession } from '../../assets/js/modules/auth-manager.js';
    import { showSuccess, showToast, setLoadingState } from '../../assets/js/modules/error-handler.js';

    function fmt(n){ return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n||0); }

    function render() {
      const cart = getCart();
      const layout = document.getElementById('cartLayout');
      if (!cart.length) {
        layout.innerHTML = '<div class="empty-state"><div class="empty-icon">🛒</div><p class="empty-msg">Your cart is empty.</p><a href="shop.html" class="btn-shop">Browse Marketplace</a></div>';
        return;
      }
      const subtotal = getCartTotal();
      const delivery = subtotal > 50 ? 0 : 5.99;
      const total    = subtotal + delivery;
      layout.innerHTML = `
        <div class="cart-items" id="cartItems">
          ${cart.map(item => `
            <div class="cart-item" data-id="${item.id}">
              <img class="item-img" src="${item.image||'https://placehold.co/80x80/111318/00d2ff?text=P'}" alt="${item.name}" onerror="this.src='https://placehold.co/80x80/111318/00d2ff?text=P'">
              <div class="item-info">
                <div class="item-name">${item.name}</div>
                <div class="item-cat">${item.category||'General'}</div>
                <div class="item-price">${fmt(item.price)}</div>
              </div>
              <div class="item-controls">
                <div class="qty-ctrl">
                  <button class="qty-btn" onclick="changeQty('${item.id}',-1)">−</button>
                  <span class="qty-num">${item.quantity||1}</span>
                  <button class="qty-btn" onclick="changeQty('${item.id}',1)">+</button>
                </div>
                <button class="remove-btn" onclick="removeItem('${item.id}')">Remove</button>
              </div>
            </div>`).join('')}
        </div>
        <div class="order-summary">
          <h2 class="summary-title">Order Summary</h2>
          <div class="summary-row"><span class="label">Subtotal (${getCartCount()} items)</span><span>${fmt(subtotal)}</span></div>
          <div class="summary-row"><span class="label">Estimated Delivery</span><span>${delivery===0?'<span style="color:#10b981">FREE</span>':fmt(delivery)}</span></div>
          <div class="summary-total"><span>Total</span><span class="total-amount">${fmt(total)}</span></div>
          <button class="btn-checkout" id="checkoutBtn" onclick="doCheckout()">Checkout →</button>
          <a href="shop.html" class="btn-continue">← Continue Shopping</a>
          ${subtotal < 50 ? '<p style="font-size:.75rem;color:#a0aec0;text-align:center;margin-top:.75rem">Add '+fmt(50-subtotal)+' more for free delivery!</p>' : ''}
        </div>`;
    }

    window.changeQty = function(id, d) { updateQuantity(id, (getCart().find(i=>i.id===id)?.quantity||1)+d); render(); };
    window.removeItem = function(id) { removeFromCart(id); showToast('Item removed from cart','info'); render(); };
    window.doCheckout = async function() {
      const session = getSession();
      if (!session) { window.location.href='../auth/login.html'; return; }
      const cart = getCart();
      if (!cart.length) return;
      const btn = document.getElementById('checkoutBtn');
      setLoadingState(btn, true, 'Placing order...');
      try {
        const productIds = cart.map(i=>i.id);
        const vendorIds  = [...new Set(cart.map(i=>i.vendorId).filter(Boolean))];
        const result     = await OrdersAPI.create(session.uid, productIds, getCartTotal(), vendorIds);
        if (result.success) {
          clearCart(); showSuccess('Order placed! Order ID: #'+result.orderId.slice(-6).toUpperCase());
          setTimeout(()=>window.location.href='all-orders.html',2000);
        } else { showToast('Failed to place order.','error'); setLoadingState(btn,false); }
      } catch(e) { showToast('Error placing order.','error'); setLoadingState(btn,false); }
    };

    render();
  </script>
</body>
</html>
