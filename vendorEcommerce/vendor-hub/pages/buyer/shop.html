<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marketplace – VendorHub</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;background:#0a0b10;color:#fff;min-height:100vh}
    a{color:inherit;text-decoration:none}
    
    .nav{display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem;height:64px;background:rgba(10,11,16,0.9);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.06);position:sticky;top:0;z-index:50}
    .nav-brand{font-family:'Orbitron',sans-serif;font-size:1.1rem;font-weight:800;background:linear-gradient(135deg,#00d2ff,#3a7bd5);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .nav-search{flex:1;max-width:400px;margin:0 1.5rem;position:relative}
    .nav-search input{width:100%;padding:.55rem 1rem .55rem 2.5rem;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#fff;font-size:.875rem;outline:none;transition:border-color .2s}
    .nav-search input:focus{border-color:#00d2ff}
    .nav-search input::placeholder{color:#4a5568}
    .nav-search-icon{position:absolute;left:.75rem;top:50%;transform:translateY(-50%);color:#4a5568;font-size:.875rem}
    .nav-actions{display:flex;align-items:center;gap:.75rem}
    .cart-btn{position:relative;padding:.5rem .9rem;background:rgba(0,210,255,0.1);border:1px solid rgba(0,210,255,0.2);border-radius:8px;color:#00d2ff;cursor:pointer;font-size:.875rem;font-weight:600;transition:all .2s;display:flex;align-items:center;gap:.4rem}
    .cart-btn:hover{background:rgba(0,210,255,0.18)}
    .cart-badge{background:#ef4444;color:#fff;border-radius:999px;font-size:.65rem;font-weight:700;padding:.1rem .35rem;margin-left:.15rem}
    .btn-sm{padding:.45rem .9rem;border-radius:8px;font-size:.8rem;font-weight:600}
    .btn-cyan{background:linear-gradient(135deg,#00d2ff,#3a7bd5);color:#fff;border:none;cursor:pointer;transition:transform .2s}
    .btn-cyan:hover{transform:translateY(-1px)}

    .page{display:grid;grid-template-columns:240px 1fr;gap:1.5rem;max-width:1300px;margin:0 auto;padding:1.5rem}
    .sidebar{background:rgba(17,19,24,0.8);border:1px solid rgba(255,255,255,0.07);border-radius:16px;padding:1.25rem;position:sticky;top:80px;height:fit-content;backdrop-filter:blur(10px)}
    .sidebar-title{font-size:.72rem;text-transform:uppercase;letter-spacing:1px;color:#4a5568;font-weight:600;margin-bottom:.875rem}
    .filter-group{margin-bottom:1.5rem}
    .filter-label{font-size:.8rem;font-weight:500;color:#a0aec0;margin-bottom:.6rem;display:block}
    .filter-option{display:flex;align-items:center;gap:.6rem;padding:.4rem 0;cursor:pointer;color:#a0aec0;font-size:.85rem;transition:color .15s}
    .filter-option:hover,.filter-option.active{color:#00d2ff}
    .filter-option input[type=radio]{accent-color:#00d2ff}
    .price-range{width:100%;accent-color:#00d2ff;margin:.5rem 0}
    .price-labels{display:flex;justify-content:space-between;font-size:.72rem;color:#4a5568}
    .sort-select{width:100%;padding:.55rem .75rem;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:#fff;font-size:.85rem;outline:none;cursor:pointer}
    .sort-select option{background:#1a1d26}
    .main-content{min-width:0}
    .page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem}
    .page-title{font-size:1.4rem;font-weight:700}
    .result-count{font-size:.85rem;color:#a0aec0}
    .products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1.25rem}
    .product-card{background:rgba(17,19,24,0.85);border:1px solid rgba(255,255,255,0.07);border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .3s,border-color .3s,box-shadow .3s}
    .product-card:hover{transform:translateY(-4px);border-color:rgba(0,210,255,.2);box-shadow:0 10px 30px rgba(0,0,0,.5)}
    .product-img{height:180px;overflow:hidden;position:relative}
    .product-img img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
    .product-card:hover .product-img img{transform:scale(1.05)}
    .category-badge{position:absolute;top:.5rem;right:.5rem;background:rgba(0,210,255,0.15);color:#00d2ff;border:1px solid rgba(0,210,255,.3);padding:.2rem .55rem;border-radius:20px;font-size:.7rem}
    .product-body{padding:1.1rem}
    .product-name{font-size:.9rem;font-weight:600;color:#fff;margin-bottom:.35rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .product-desc{font-size:.75rem;color:#a0aec0;margin-bottom:.875rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .product-footer{display:flex;justify-content:space-between;align-items:center}
    .product-price{font-size:1.05rem;font-weight:700;background:linear-gradient(135deg,#00d2ff,#3a7bd5);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .product-stock{font-size:.7rem}
    .add-cart-btn{width:100%;margin-top:.75rem;padding:.5rem;background:linear-gradient(135deg,#00d2ff,#3a7bd5);color:#fff;border:none;border-radius:8px;font-weight:600;font-size:.8rem;cursor:pointer;transition:.2s}
    .add-cart-btn:hover{opacity:.9}
    .add-cart-btn:disabled{opacity:.45;cursor:not-allowed}
    .skeleton{background:linear-gradient(90deg,rgba(255,255,255,0.04) 25%,rgba(255,255,255,0.08) 50%,rgba(255,255,255,0.04) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:8px}
    @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
    .skel-card{background:rgba(17,19,24,0.8);border:1px solid rgba(255,255,255,0.05);border-radius:14px;overflow:hidden}
    .empty-state{text-align:center;padding:3.5rem;grid-column:1/-1;color:#4a5568}
    .empty-state .icon{font-size:3rem;margin-bottom:1rem}
    @media(max-width:768px){.page{grid-template-columns:1fr}.sidebar{display:none}}
  </style>
</head>
<body>
  <nav class="nav">
    <a href="../../index.html" class="nav-brand">VendorHub</a>
    <div class="nav-search">
      <span class="nav-search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Search products...">
    </div>
    <div class="nav-actions">
      <a href="cart.html" class="cart-btn">🛒 Cart <span class="cart-badge" data-cart-count style="display:none">0</span></a>
      <a href="../auth/login.html" class="btn-sm btn-cyan">Sign In</a>
    </div>
  </nav>

  <div class="page">
    <aside class="sidebar">
      <p class="sidebar-title">Filters</p>
      <div class="filter-group">
        <span class="filter-label">Category</span>
        <label class="filter-option active"><input type="radio" name="cat" value="" checked> All Categories</label>
        <label class="filter-option"><input type="radio" name="cat" value="Electronics"> 💻 Electronics</label>
        <label class="filter-option"><input type="radio" name="cat" value="Fashion"> 👕 Fashion</label>
        <label class="filter-option"><input type="radio" name="cat" value="Food"> 🍔 Food</label>
        <label class="filter-option"><input type="radio" name="cat" value="Home"> 🏠 Home</label>
        <label class="filter-option"><input type="radio" name="cat" value="Beauty"> 💄 Beauty</label>
        <label class="filter-option"><input type="radio" name="cat" value="Sports"> ⚽ Sports</label>
        <label class="filter-option"><input type="radio" name="cat" value="Books"> 📚 Books</label>
      </div>
      <div class="filter-group">
        <span class="filter-label">Max Price: $<span id="priceVal">500</span></span>
        <input type="range" class="price-range" id="priceRange" min="0" max="1000" value="500">
        <div class="price-labels"><span>$0</span><span>$1000</span></div>
      </div>
      <div class="filter-group">
        <span class="filter-label">Sort By</span>
        <select class="sort-select" id="sortSelect">
          <option value="default">Default</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
          <option value="name">Name A–Z</option>
        </select>
      </div>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <h1 class="page-title">Marketplace</h1>
        <span class="result-count" id="resultCount">Loading...</span>
      </div>
      <div class="products-grid" id="productsGrid">
        <!-- skeleton -->
        <div class="skel-card"><div class="skeleton" style="height:180px"></div><div style="padding:1rem"><div class="skeleton" style="height:14px;margin-bottom:.5rem"></div><div class="skeleton" style="height:10px;width:70%"></div></div></div>
        <div class="skel-card"><div class="skeleton" style="height:180px"></div><div style="padding:1rem"><div class="skeleton" style="height:14px;margin-bottom:.5rem"></div><div class="skeleton" style="height:10px;width:70%"></div></div></div>
        <div class="skel-card"><div class="skeleton" style="height:180px"></div><div style="padding:1rem"><div class="skeleton" style="height:14px;margin-bottom:.5rem"></div><div class="skeleton" style="height:10px;width:70%"></div></div></div>
        <div class="skel-card"><div class="skeleton" style="height:180px"></div><div style="padding:1rem"><div class="skeleton" style="height:14px;margin-bottom:.5rem"></div><div class="skeleton" style="height:10px;width:70%"></div></div></div>
      </div>
    </main>
  </div>

  <script type="module">
    import { ProductsAPI } from '../../assets/js/modules/api-service.js';
    import { addToCart, updateCartBadge } from '../../assets/js/modules/cart.js';
    import { formatCurrency, getCategoryIcon, debounce } from '../../assets/js/utils/helpers.js';
    import { showSuccess, showToast } from '../../assets/js/modules/error-handler.js';

    updateCartBadge();
    let allProducts = [];

    function renderProducts(products) {
      const grid = document.getElementById('productsGrid');
      document.getElementById('resultCount').textContent = products.length + ' products';
      if (!products.length) {
        grid.innerHTML = '<div class="empty-state"><div class="icon">🔍</div><p>No products found.</p></div>';
        return;
      }
      grid.innerHTML = products.map(p => {
        const img = p.image || `https://placehold.co/300x180/111318/00d2ff?text=${encodeURIComponent(p.name||'Product')}`;
        const price = new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(p.price||0);
        const icon = {'electronics':'💻','food':'🍔','fashion':'👕','home':'🏠','beauty':'💄','sports':'⚽','books':'📚'}[p.category?.toLowerCase()]||'📦';
        return `<div class="product-card" onclick="window.location='product-details.html?id=${p.id}'">
          <div class="product-img"><img src="${img}" alt="${p.name}" onerror="this.src='https://placehold.co/300x180/111318/00d2ff?text=No+Image'"><span class="category-badge">${icon} ${p.category||'General'}</span></div>
          <div class="product-body">
            <div class="product-name">${p.name||'Unnamed'}</div>
            <div class="product-desc">${p.description||'No description'}</div>
            <div class="product-footer">
              <span class="product-price">${price}</span>
              <span class="product-stock" style="color:${p.stock>0?'#10b981':'#ef4444'}">${p.stock>0?'✓ In stock':'✕ Out'}</span>
            </div>
            <button class="add-cart-btn" data-id="${p.id}" ${p.stock<=0?'disabled':''} onclick="event.stopPropagation();addItem(event, '${p.id}')">${p.stock>0?'🛒 Add to Cart':'Out of Stock'}</button>
          </div></div>`;
      }).join('');
    }

    function getFiltered() {
      const cat  = document.querySelector('[name=cat]:checked')?.value||'';
      const maxP = Number(document.getElementById('priceRange').value)||1000;
      const sort = document.getElementById('sortSelect').value;
      const q    = document.getElementById('searchInput').value.toLowerCase();
      let list = allProducts.filter(p => (!cat||p.category===cat) && (p.price||0)<=maxP && (!q||(p.name+p.description+p.category||'').toLowerCase().includes(q)));
      if (sort==='price-asc')  list.sort((a,b)=>a.price-b.price);
      if (sort==='price-desc') list.sort((a,b)=>b.price-a.price);
      if (sort==='name')       list.sort((a,b)=>(a.name||'').localeCompare(b.name||''));
      return list;
    }

    window.addItem = function(e, id) {
      const p = allProducts.find(x=>x.id===id);
      if (p) { addToCart(p); showSuccess('Added to cart!'); updateCartBadge(); }
    };

    document.querySelectorAll('[name=cat]').forEach(r=>r.addEventListener('change',()=>renderProducts(getFiltered())));
    document.getElementById('priceRange').addEventListener('input',function(){document.getElementById('priceVal').textContent=this.value;renderProducts(getFiltered());});
    document.getElementById('sortSelect').addEventListener('change',()=>renderProducts(getFiltered()));
    document.getElementById('searchInput').addEventListener('input', debounce(()=>renderProducts(getFiltered()),300));

    (async()=>{
      try { allProducts = await ProductsAPI.getAll(); renderProducts(allProducts); }
      catch(e) { document.getElementById('productsGrid').innerHTML='<div class="empty-state"><div class="icon">⚠️</div><p>Failed to load products. Please check your connection.</p></div>'; }
    })();
  </script>
</body>
</html>
